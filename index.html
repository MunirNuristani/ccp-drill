"Wrong — this describes an on-premises model, the opposite of how responsibility shifts with a serverless service.",
"Wrong — the shared responsibility model still applies to every AWS service, including serverless ones; the split of duties just shifts.",
"Wrong — AWS never takes responsibility for the logic or correctness of a customer's own application code."
]},
{domain:"security", q:"Which service lets you provision, manage, and deploy free public SSL/TLS certificates for use with AWS services like CloudFront and Elastic Load Balancing?", options:[
"AWS Certificate Manager (ACM)",
"AWS Key Management Service (AWS KMS)",
"AWS Secrets Manager",
"AWS CloudHSM",
], exp:[
"Correct — ACM issues and manages SSL/TLS certificates that integrate directly with services such as CloudFront and ELB.",
"Wrong — KMS manages cryptographic keys for encrypting data, not SSL/TLS website certificates specifically.",
"Wrong — Secrets Manager stores secrets like database credentials, not public SSL/TLS certificates.",
"Wrong — CloudHSM provides dedicated hardware security modules for key storage, not free public certificate issuance."
]},
{domain:"security", q:"Which service provides dedicated hardware security modules (HSMs) so a customer can manage their own encryption keys to meet strict compliance requirements?", options:[
"AWS CloudHSM",
"AWS Key Management Service (AWS KMS)",
"AWS Certificate Manager",
"Amazon Cognito",
], exp:[
"Correct — CloudHSM gives you access to single-tenant hardware security modules for full control over key storage, useful for strict compliance needs.",
"Wrong — KMS is a managed, multi-tenant key management service; CloudHSM is the option that provides dedicated single-tenant hardware.",
"Wrong — Certificate Manager issues and manages certificates, not general-purpose hardware-backed key storage.",
"Wrong — Cognito manages user identities for applications, unrelated to hardware key storage."
]},
{domain:"security", q:"Which service provides sign-up, sign-in, and access control specifically for customer-facing web and mobile applications?", options:[
"Amazon Cognito",
"AWS IAM Identity Center",
"AWS Directory Service",
"AWS Identity and Access Management (IAM)",
], exp:[
"Correct — Cognito is designed to add user sign-up, sign-in, and access control to your own customer-facing applications.",
"Wrong — IAM Identity Center provides workforce SSO to AWS accounts and business applications, not customer-facing app authentication.",
"Wrong — Directory Service integrates with Microsoft Active Directory, a different use case than customer-facing app sign-in.",
"Wrong — IAM manages access to AWS resources and services, not sign-up/sign-in flows for your own external application's end users."
]},
{domain:"security", q:"Which service lets you set up and run Microsoft Active Directory in AWS or connect AWS resources to an existing on-premises Active Directory?", options:[
"AWS Directory Service",
"Amazon Cognito",
"AWS IAM Identity Center",
"AWS Secrets Manager",
], exp:[
"Correct — Directory Service provides managed Active Directory options and connects to existing on-premises directories.",
"Wrong — Cognito focuses on identity for customer-facing applications, not Active Directory integration.",
"Wrong — IAM Identity Center provides SSO across AWS accounts, which can integrate with directories but isn't the directory service itself.",
"Wrong — Secrets Manager stores secrets like credentials; it doesn't provide directory services."
]},
{domain:"security", q:"Which service lets you centrally configure and manage security rules, such as AWS WAF rules and Shield protections, across multiple accounts in an organization?", options:[
"AWS Firewall Manager",
"AWS Network Firewall",
"AWS Security Hub",
"AWS Config",
], exp:[
"Correct — Firewall Manager centrally manages firewall and protection rules (like WAF and Shield) across accounts in an AWS Organization.",
"Wrong — Network Firewall is the managed network-layer firewall itself, not the cross-account management layer for WAF/Shield rules.",
"Wrong — Security Hub aggregates security findings; it doesn't centrally configure firewall rules across accounts.",
"Wrong — Config tracks resource configuration compliance, not the centralized management of firewall rules."
]},
{domain:"security", q:"Which service provides a managed network firewall for filtering traffic at the VPC level, offering more granular control than security groups alone?", options:[
"AWS Network Firewall",
"AWS WAF",
"AWS Shield",
"AWS Firewall Manager",
], exp:[
"Correct — Network Firewall is a managed firewall service that inspects and filters network traffic at the VPC level with fine-grained rules.",
"Wrong — WAF filters HTTP/HTTPS requests at the web application layer, not general VPC network traffic.",
"Wrong — Shield protects against DDoS attacks rather than providing general-purpose network traffic filtering rules.",
"Wrong — Firewall Manager centrally manages firewall policies across accounts, but Network Firewall is the actual firewall being managed."
]},
{domain:"security", q:"Which of the following is a task that only the AWS account root user can perform, not a regular IAM user with administrator permissions?", options:[
"Closing the AWS account",
"Launching an EC2 instance",
"Creating an S3 bucket",
"Creating an IAM policy",
], exp:[
"Correct — certain sensitive actions, like closing the account or changing the account's root email, are restricted to the root user.",
"Wrong — an IAM user with sufficient permissions can launch EC2 instances; this is not root-only.",
"Wrong — an IAM user with sufficient permissions can create S3 buckets; this is not root-only.",
"Wrong — an IAM user with sufficient permissions can create IAM policies; this is not restricted to the root user."
]},
{domain:"security", q:"Which of these is correctly categorized as a customer responsibility under the AWS Shared Responsibility Model, regardless of which AWS service is used?", options:[
"Managing and classifying the customer's own data",
"Physical security of the AWS data centers",
"Patching the underlying hypervisor",
"Decommissioning physical storage media at end of life",
], exp:[
"Correct — customers are always responsible for their own data and how it is classified and protected, no matter which AWS service they use.",
"Wrong — physical data center security is part of AWS's responsibility for security \"of\" the cloud.",
"Wrong — patching the hypervisor is part of AWS's infrastructure responsibility.",
"Wrong — decommissioning physical media is handled by AWS as part of managing the underlying hardware."
]},
{domain:"security", q:"Which AWS WAF feature helps protect a web application from being overwhelmed by an excessive number of requests from a single IP address?", options:[
"Rate-based rules",
"Security groups",
"Numbered Network ACL rules",
"GuardDuty findings",
], exp:[
"Correct — WAF rate-based rules automatically block or throttle requests from IP addresses that exceed a defined request threshold.",
"Wrong — security groups control which traffic is allowed to reach a resource, but don't provide request-rate throttling.",
"Wrong — Network ACLs filter traffic by numbered rules at the subnet level; they don't perform application-layer rate limiting.",
"Wrong — GuardDuty detects and reports threats; it doesn't itself throttle incoming web requests."
]},
{domain:"security", q:"Which service lets you securely share specific AWS resources, such as subnets or Transit Gateways, across multiple AWS accounts without duplicating them?", options:[
"AWS Resource Access Manager (AWS RAM)",
"AWS Organizations",
"AWS Identity and Access Management (IAM)",
"AWS Security Hub",
], exp:[
"Correct — AWS RAM lets you share supported resources with other accounts, avoiding the need to duplicate them in each account.",
"Wrong — Organizations manages account structure and consolidated billing, but resource sharing itself is done through RAM.",
"Wrong — IAM manages permissions for identities, not the cross-account sharing of specific resources like subnets.",
"Wrong — Security Hub aggregates security findings; it doesn't manage cross-account resource sharing."
]},

// ---------------- ADDITIONAL: CLOUD TECHNOLOGY AND SERVICES ----------------
{domain:"tech", q:"What is the primary purpose of AWS Local Zones?", options:[
"To extend AWS infrastructure closer to large population and industry centers, for latency-sensitive applications",
"To completely replace the need for Availability Zones",
"To provide a physical device for offline bulk data transfer into AWS",
"To host only IoT devices at the network edge",
], exp:[
"Correct — Local Zones place compute and storage closer to specific metro areas to reduce latency for end users in that area.",
"Wrong — Local Zones supplement, rather than replace, the standard Availability Zone model within a Region.",
"Wrong — that describes AWS Snowball, a completely different offering for offline data transfer.",
"Wrong — Local Zones support general compute and storage workloads, not exclusively IoT devices."
]},
{domain:"tech", q:"Which AWS offering embeds AWS compute and storage within telecommunications providers' 5G networks to enable ultra-low-latency applications for mobile devices?", options:[
"AWS Wavelength",
"AWS Local Zones",
"AWS Outposts",
"AWS Global Accelerator",
], exp:[
"Correct — Wavelength Zones are embedded within telecom providers' 5G networks specifically to minimize latency for mobile-connected applications.",
"Wrong — Local Zones bring AWS infrastructure closer to metro areas generally, not specifically embedded within 5G telecom networks.",
"Wrong — Outposts brings AWS infrastructure into a customer's own on-premises data center, not into telecom 5G networks.",
"Wrong — Global Accelerator optimizes routing over the AWS global network; it doesn't embed infrastructure inside telecom networks."
]},
{domain:"tech", q:"Which service extends AWS infrastructure and select AWS services to run on-premises, inside a customer's own data center?", options:[
"AWS Outposts",
"AWS Local Zones",
"AWS Wavelength",
"AWS Direct Connect",
], exp:[
"Correct — Outposts delivers AWS-managed hardware and services directly to a customer's on-premises facility.",
"Wrong — Local Zones extend AWS infrastructure into specific metro areas, but remain part of AWS-operated facilities, not the customer's own data center.",
"Wrong — Wavelength embeds AWS infrastructure into telecom 5G networks, not a customer's own data center.",
"Wrong — Direct Connect provides a dedicated network link to AWS; it doesn't place AWS hardware on-premises."
]},
{domain:"tech", q:"Which service improves the availability and performance of applications by routing user traffic through the AWS global network to the optimal endpoint?", options:[
"AWS Global Accelerator",
"Amazon CloudFront",
"Amazon Route 53",
"AWS Direct Connect",
], exp:[
"Correct — Global Accelerator uses the AWS global network to route traffic to the healthiest, closest application endpoint, improving performance and availability.",
"Wrong — CloudFront is a CDN focused on caching and delivering static and dynamic content, a different mechanism than network-layer routing optimization.",
"Wrong — Route 53 performs DNS resolution and routing at the DNS level, not the same network-layer acceleration Global Accelerator provides.",
"Wrong — Direct Connect provides a dedicated link from on-premises to AWS; it doesn't optimize routing for end-user application traffic globally."
]},
{domain:"tech", q:"A workload requires very high, sustained CPU performance for batch processing tasks. Which EC2 instance family would be most appropriate?", options:[
"Compute optimized instances",
"Storage optimized instances",
"Memory optimized instances",
"Burstable general purpose (T-family) instances",
], exp:[
"Correct — compute optimized instances are built for CPU-intensive workloads like batch processing and high-performance computing.",
"Wrong — storage optimized instances are designed for high, sequential disk I/O, not primarily raw CPU performance.",
"Wrong — memory optimized instances are designed for workloads that process large in-memory datasets, not primarily CPU-bound batch jobs.",
"Wrong — burstable instances are designed for workloads with occasional CPU spikes, not workloads needing sustained high CPU performance."
]},
{domain:"tech", q:"Which EC2 instance family is designed for workloads that require high, sequential read/write access to large local datasets, such as distributed file systems?", options:[
"Storage optimized instances",
"Compute optimized instances",
"Memory optimized instances",
"General purpose instances",
], exp:[
"Correct — storage optimized instances provide high, sequential I/O performance for large local datasets.",
"Wrong — compute optimized instances prioritize CPU performance rather than high-throughput local storage I/O.",
"Wrong — memory optimized instances prioritize large amounts of RAM rather than high-throughput local disk I/O.",
"Wrong — general purpose instances balance compute, memory, and networking but aren't optimized specifically for high-throughput storage I/O."
]},
{domain:"tech", q:"Which service helps migrate databases to AWS quickly and securely, keeping the source database fully operational throughout the migration?", options:[
"AWS Database Migration Service (AWS DMS)",
"AWS Schema Conversion Tool (AWS SCT)",
"AWS Snowball",
"AWS Storage Gateway",
], exp:[
"Correct — AWS DMS replicates data from the source to the target database while the source remains available and operational.",
"Wrong — SCT converts database schemas between different engines; it doesn't perform the ongoing data replication itself.",
"Wrong — Snowball is used for offline bulk data transfer, not live database replication.",
"Wrong — Storage Gateway connects on-premises applications to AWS storage; it isn't a database migration tool."
]},
{domain:"tech", q:"Which tool helps convert a database's schema from one engine to a different engine (for example, Oracle to Amazon Aurora PostgreSQL) before migration?", options:[
"AWS Schema Conversion Tool (AWS SCT)",
"AWS Database Migration Service (AWS DMS)",
"AWS Glue",
"AWS Migration Hub",
], exp:[
"Correct — SCT automatically converts source database schemas and code to be compatible with a different target database engine.",
"Wrong — DMS handles the ongoing data replication and migration itself, typically after schema conversion has been done.",
"Wrong — Glue is a data integration and ETL service for analytics pipelines, not database schema conversion.",
"Wrong — Migration Hub tracks the status of migrations across tools; it doesn't perform schema conversion itself."
]},
{domain:"tech", q:"Which service provides a fully managed, in-memory data store commonly used to cache frequently accessed data and reduce database load?", options:[
"Amazon ElastiCache",
"Amazon DynamoDB",
"Amazon RDS",
"Amazon Redshift",
], exp:[
"Correct — ElastiCache (supporting Redis or Memcached) is designed specifically as a fast, in-memory caching layer in front of databases.",
"Wrong — DynamoDB is a persistent NoSQL database, not primarily an in-memory caching layer.",
"Wrong — RDS is a managed relational database service, not an in-memory cache.",
"Wrong — Redshift is a data warehouse for analytics, not an in-memory caching service."
]},
{domain:"tech", q:"Which service offers a fully managed, Redis-compatible, durable in-memory database designed to serve as a primary database rather than just a cache?", options:[
"Amazon MemoryDB for Redis",
"Amazon ElastiCache",
"Amazon DynamoDB Accelerator (DAX)",
"Amazon Aurora",
], exp:[
"Correct — MemoryDB is built to be durable enough to act as a primary, Redis-compatible database, unlike a typical cache.",
"Wrong — ElastiCache is generally used as a caching layer in front of a separate primary database, not as the primary database itself.",
"Wrong — DAX is an in-memory cache specifically for DynamoDB, not a standalone Redis-compatible primary database.",
"Wrong — Aurora is a relational database compatible with MySQL/PostgreSQL, not an in-memory Redis-compatible store."
]},
{domain:"tech", q:"Which storage option provides temporary block-level storage physically attached to the host computer, which is lost when the instance stops or terminates?", options:[
"EC2 instance store",
"Amazon EBS",
"Amazon S3",
"Amazon EFS",
], exp:[
"Correct — instance store provides temporary, high-performance storage tied to the instance's underlying host, and its data does not persist beyond the instance's life in most cases.",
"Wrong — EBS volumes persist independently of the instance lifecycle (depending on configuration), unlike instance store.",
"Wrong — S3 is durable, persistent object storage, unrelated to a single instance's physical host.",
"Wrong — EFS is a persistent, shared file system, not ephemeral storage tied to one host."
]},
{domain:"tech", q:"Which service provides fully managed file storage built on popular file systems such as Windows File Server or Lustre?", options:[
"Amazon FSx",
"Amazon EFS",
"Amazon EBS",
"Amazon S3",
], exp:[
"Correct — FSx offers managed file systems including FSx for Windows File Server and FSx for Lustre, among others.",
"Wrong — EFS provides a managed Linux-based NFS file system, not Windows File Server or Lustre compatibility.",
"Wrong — EBS is block storage attached to a single EC2 instance, not a managed shared file system.",
"Wrong — S3 is object storage accessed via API calls, not a mountable Windows or Lustre file system."
]},
{domain:"tech", q:"What is the purpose of an Amazon S3 lifecycle policy?", options:[
"To automatically transition objects between storage classes or expire/delete them after a defined period, optimizing storage cost",
"To automatically encrypt every object as soon as it's uploaded",
"To replicate every object to a different AWS Region",
"To grant public read access to objects after 30 days",
], exp:[
"Correct — lifecycle policies automate moving objects to cheaper storage classes or deleting them over time based on rules you define.",
"Wrong — encryption is configured separately (for example, via default bucket encryption or KMS), not through lifecycle rules.",
"Wrong — cross-Region replication is a separate S3 feature, distinct from lifecycle policies.",
"Wrong — lifecycle policies manage storage class transitions and expiration, not public access permissions."
]},
{domain:"tech", q:"Which service centralizes and automates data backup across multiple AWS services, such as EBS, RDS, and DynamoDB, from a single console?", options:[
"AWS Backup",
"AWS Storage Gateway",
"Amazon S3 Glacier",
"AWS Snowball",
], exp:[
"Correct — AWS Backup lets you define backup policies once and apply them centrally across many supported AWS services.",
"Wrong — Storage Gateway connects on-premises environments to AWS storage; it isn't a cross-service backup management console.",
"Wrong — S3 Glacier is a low-cost archival storage class, not a backup orchestration service.",
"Wrong — Snowball is used for physical bulk data transfer, not ongoing centralized backup management."
]},
{domain:"tech", q:"Which service lets you run SQL queries directly against data stored in Amazon S3 without provisioning or managing any servers?", options:[
"Amazon Athena",
"Amazon Redshift",
"Amazon EMR",
"AWS Glue",
], exp:[
"Correct — Athena is a serverless interactive query service that lets you query data in S3 using standard SQL.",
"Wrong — Redshift is a provisioned (or serverless-configured) data warehouse cluster, a heavier-weight solution than Athena's serverless queries.",
"Wrong — EMR runs big data frameworks like Spark or Hadoop on managed clusters, requiring more setup than Athena.",
"Wrong — Glue focuses on data cataloging and ETL jobs, not ad hoc SQL querying of S3 data."
]},
{domain:"tech", q:"Which service is designed to collect, process, and analyze real-time streaming data, such as clickstreams or IoT telemetry?", options:[
"Amazon Kinesis",
"Amazon Athena",
"Amazon QuickSight",
"Amazon Redshift",
], exp:[
"Correct — Kinesis is purpose-built for ingesting and processing real-time streaming data at scale.",
"Wrong — Athena queries data already stored in S3; it isn't designed for ingesting real-time streams.",
"Wrong — QuickSight is a business intelligence visualization tool, not a stream ingestion service.",
"Wrong — Redshift is a data warehouse for batch analytical queries, not primarily a real-time stream ingestion service."
]},
{domain:"tech", q:"Which service is a serverless data integration service used to discover, prepare, and combine data for analytics through extract, transform, and load (ETL) jobs?", options:[
"AWS Glue",
"Amazon Athena",
"Amazon Kinesis",
"Amazon EMR",
], exp:[
"Correct — Glue provides serverless ETL capabilities along with a data catalog to prepare data for analytics.",
"Wrong — Athena queries already-prepared data in S3; it isn't focused on the ETL process itself.",
"Wrong — Kinesis focuses on real-time data streaming, not batch ETL data preparation.",
"Wrong — EMR runs big data processing frameworks on managed clusters, a heavier-weight alternative to Glue's serverless ETL jobs."
]},
{domain:"tech", q:"Which service provides business intelligence dashboards and visualizations that let teams explore and share data insights?", options:[
"Amazon QuickSight",
"Amazon Athena",
"AWS Glue",
"Amazon Redshift",
], exp:[
"Correct — QuickSight is AWS's business intelligence service for building interactive dashboards and visualizations.",
"Wrong — Athena is a query engine for S3 data; it doesn't provide dashboarding and visualization features itself.",
"Wrong — Glue is used for data preparation and ETL, not for building end-user dashboards.",
"Wrong — Redshift stores and queries data at scale, but dashboarding and visualization is handled by a tool like QuickSight."
]},
{domain:"tech", q:"Which service makes it easy to run big data frameworks such as Apache Spark and Hadoop on a managed cluster to process large datasets?", options:[
"Amazon EMR",
"AWS Glue",
"Amazon Athena",
"Amazon Kinesis",
], exp:[
"Correct — EMR provisions and manages clusters running big data frameworks like Spark and Hadoop.",
"Wrong — Glue provides serverless ETL jobs and a data catalog, a lighter-weight approach than managing Spark/Hadoop clusters directly.",
"Wrong — Athena is a serverless query engine for S3 data, not a managed big-data cluster service.",
"Wrong — Kinesis is focused on real-time streaming ingestion, not managed Spark/Hadoop cluster processing."
]},
{domain:"tech", q:"Which service is used to build conversational interfaces, such as chatbots, using voice and text, powered by the same technology behind Alexa?", options:[
"Amazon Lex",
"Amazon Polly",
"Amazon Comprehend",
"Amazon Connect",
], exp:[
"Correct — Lex provides the natural language understanding and conversational engine used to build chatbots and voice interfaces.",
"Wrong — Polly converts text into spoken audio; it doesn't provide conversational understanding on its own.",
"Wrong — Comprehend analyzes text for insights like sentiment; it isn't designed to build interactive conversational bots.",
"Wrong — Connect is a cloud contact center service; it can integrate with Lex bots but isn't itself the conversational AI engine."
]},
{domain:"tech", q:"Which service uses natural language processing (NLP) to find insights such as sentiment and key phrases within text?", options:[
"Amazon Comprehend",
"Amazon Lex",
"Amazon Polly",
"Amazon Translate",
], exp:[
"Correct — Comprehend analyzes text to extract entities, key phrases, sentiment, and language, among other insights.",
"Wrong — Lex is used to build conversational chatbot interfaces, not primarily to analyze arbitrary text for sentiment.",
"Wrong — Polly converts text into spoken audio; it doesn't analyze text for sentiment or key phrases.",
"Wrong — Translate converts text between languages; it doesn't perform sentiment or key-phrase analysis."
]},
{domain:"tech", q:"Which AWS service converts written text into lifelike spoken audio?", options:[
"Amazon Polly",
"Amazon Transcribe",
"Amazon Translate",
"Amazon Textract",
], exp:[
"Correct — Polly performs text-to-speech, turning text into natural-sounding audio.",
"Wrong — Transcribe does the opposite: it converts speech (audio) into text.",
"Wrong — Translate converts text from one language to another; it doesn't produce spoken audio.",
"Wrong — Textract extracts text and data from scanned documents; it doesn't generate speech."
]},
{domain:"tech", q:"Which service automatically extracts text, handwriting, and structured data such as tables and forms from scanned documents?", options:[
"Amazon Textract",
"Amazon Comprehend",
"Amazon Rekognition",
"Amazon Kendra",
], exp:[
"Correct — Textract is purpose-built to pull text and structured data like tables and forms out of scanned documents.",
"Wrong — Comprehend analyzes text that has already been extracted, rather than pulling text out of document images itself.",
"Wrong — Rekognition analyzes images and video for objects, faces, and scenes, not structured document data extraction.",
"Wrong — Kendra provides intelligent search across documents, but doesn't specialize in extracting structured data like tables and forms."
]},
{domain:"tech", q:"Which service provides intelligent enterprise search powered by machine learning, letting users ask natural-language questions across internal documents?", options:[
"Amazon Kendra",
"Amazon Athena",
"Amazon Comprehend",
"Amazon OpenSearch Service",
], exp:[
"Correct — Kendra is designed for natural-language enterprise search across internal content repositories.",
"Wrong — Athena is a SQL query engine for structured data in S3, not a natural-language document search service.",
"Wrong — Comprehend extracts insights like sentiment from text, but doesn't provide a natural-language search experience.",
"Wrong — OpenSearch Service provides general search and analytics infrastructure, but Kendra is the ML-powered natural-language enterprise search offering."
]},
{domain:"tech", q:"Which service is a serverless event bus that connects data from your own applications, SaaS applications, and AWS services using rule-based routing?", options:[
"Amazon EventBridge",
"Amazon SQS",
"Amazon SNS",
"AWS Step Functions",
], exp:[
"Correct — EventBridge routes events between sources like custom apps, SaaS providers, and AWS services based on rules you define.",
"Wrong — SQS is a message queue for decoupling components, not an event-routing bus with rule-based matching across many sources.",
"Wrong — SNS is a pub/sub notification service; it lacks EventBridge's rich, rule-based routing across many event sources.",
"Wrong — Step Functions orchestrates workflows as state machines, rather than acting as a general-purpose event bus."
]},
{domain:"tech", q:"Which service lets you coordinate multiple AWS services into serverless workflows using visual state machines?", options:[
"AWS Step Functions",
"Amazon EventBridge",
"Amazon SQS",
"Amazon SNS",
], exp:[
"Correct — Step Functions lets you design multi-step workflows as state machines that coordinate calls to other AWS services.",
"Wrong — EventBridge routes individual events between sources and targets, rather than orchestrating a defined multi-step workflow.",
"Wrong — SQS is a message queue for decoupling components, not a workflow orchestration tool.",
"Wrong — SNS delivers notifications to subscribers; it doesn't orchestrate multi-step workflows."
]},
{domain:"tech", q:"Which service provides an omnichannel cloud contact center that companies use to manage customer service calls and chats?", options:[
"Amazon Connect",
"Amazon Simple Email Service (Amazon SES)",
"Amazon Simple Notification Service (Amazon SNS)",
"AWS IQ",
], exp:[
"Correct — Connect is AWS's cloud-based contact center service for managing customer calls, chats, and related workflows.",
"Wrong — SES is used for sending and receiving email at scale, not for running a contact center.",
"Wrong — SNS delivers notifications to subscribers; it isn't a contact center platform.",
"Wrong — AWS IQ connects customers with independent experts for project work, unrelated to contact center operations."
]},
{domain:"tech", q:"Which service is used to send and receive high-volume transactional and marketing email from within applications?", options:[
"Amazon Simple Email Service (Amazon SES)",
"Amazon Simple Notification Service (Amazon SNS)",
"Amazon Connect",
"AWS Amplify",
], exp:[
"Correct — SES is purpose-built for sending and receiving email at scale from applications.",
"Wrong — SNS delivers notifications across channels like SMS, mobile push, and email subscriptions, but isn't focused on transactional/marketing email sending infrastructure the way SES is.",
"Wrong — Connect is a contact center service for calls and chat, not an email-sending service.",
"Wrong — Amplify helps build and deploy web and mobile apps; it isn't an email delivery service."
]},
{domain:"tech", q:"Which service provides a cloud-based integrated development environment (IDE) that you access through a web browser?", options:[
"AWS Cloud9",
"AWS CloudShell",
"AWS CodeCommit",
"AWS CodeBuild",
], exp:[
"Correct — Cloud9 provides a full browser-based IDE with a code editor, debugger, and terminal.",
"Wrong — CloudShell provides a browser-based command-line shell, not a full IDE with a code editor and debugger.",
"Wrong — CodeCommit is a managed source control (Git) service, not an IDE.",
"Wrong — CodeBuild compiles and tests code as part of a CI/CD pipeline; it isn't an interactive IDE."
]},
{domain:"tech", q:"Which service automates the build, test, and deploy phases of your release process as a continuous delivery pipeline?", options:[
"AWS CodePipeline",
"AWS CodeCommit",
"AWS CodeBuild",
"AWS CodeDeploy",
], exp:[
"Correct — CodePipeline orchestrates the end-to-end release process, coordinating source, build, test, and deploy stages.",
"Wrong — CodeCommit provides source control (Git repositories), a single stage a pipeline might use, not the pipeline orchestration itself.",
"Wrong — CodeBuild only handles the build/test stage, not the full end-to-end pipeline.",
"Wrong — CodeDeploy only handles the deployment stage, not the full pipeline covering build and test as well."
]},
{domain:"tech", q:"Which service helps developers analyze and debug distributed applications by tracing requests as they travel through multiple services?", options:[
"AWS X-Ray",
"Amazon CloudWatch",
"AWS CloudTrail",
"AWS Config",
], exp:[
"Correct — X-Ray traces requests end-to-end across distributed application components, helping pinpoint performance issues and errors.",
"Wrong — CloudWatch collects metrics, logs, and alarms broadly, but distributed request tracing specifically is X-Ray's role.",
"Wrong — CloudTrail logs API calls for auditing, not request-level tracing through an application's components.",
"Wrong — Config tracks resource configuration changes, unrelated to tracing application requests."
]},
{domain:"tech", q:"Which service provides fully managed, persistent virtual desktops in the cloud that end users can access from various devices?", options:[
"Amazon WorkSpaces",
"Amazon AppStream 2.0",
"Amazon Connect",
"Amazon Lightsail",
], exp:[
"Correct — WorkSpaces provisions persistent, personal virtual desktops that users can log into repeatedly, similar to a physical desktop.",
"Wrong — AppStream 2.0 streams individual applications rather than providing a full persistent desktop per user.",
"Wrong — Connect is a contact center service, unrelated to virtual desktops.",
"Wrong — Lightsail provides simplified virtual private servers, not managed end-user virtual desktops."
]},
{domain:"tech", q:"Which service streams individual desktop applications to a web browser without provisioning a full virtual desktop for each user?", options:[
"Amazon AppStream 2.0",
"Amazon WorkSpaces",
"Amazon WorkSpaces Web",
"Amazon Lightsail",
], exp:[
"Correct — AppStream 2.0 streams specific applications on demand, rather than a full persistent desktop environment.",
"Wrong — WorkSpaces provisions a full, persistent virtual desktop per user, a heavier-weight solution than streaming a single app.",
"Wrong — WorkSpaces Web provides browser-based access to internal web applications, a different use case than streaming general desktop apps.",
"Wrong — Lightsail provides simple virtual private servers, not application streaming."
]},
{domain:"tech", q:"Which service provides tools to help developers quickly build and deploy full-stack web and mobile applications, including frontend hosting and backend integration?", options:[
"AWS Amplify",
"AWS AppSync",
"AWS CodeStar",
"AWS Device Farm",
], exp:[
"Correct — Amplify provides an end-to-end toolchain for building, hosting, and deploying full-stack web and mobile applications.",
"Wrong — AppSync focuses specifically on managed GraphQL APIs, a narrower piece of the full-stack picture than Amplify.",
"Wrong — CodeStar helps set up CI/CD projects, but isn't focused specifically on frontend/mobile app development like Amplify.",
"Wrong — Device Farm is used for testing apps across real devices, not for building or hosting the application itself."
]},
{domain:"tech", q:"Which service lets internet-connected devices securely interact with cloud applications and other devices?", options:[
"AWS IoT Core",
"AWS IoT Greengrass",
"Amazon Kinesis",
"Amazon EventBridge",
], exp:[
"Correct — IoT Core provides the secure device connectivity and messaging backbone for IoT applications.",
"Wrong — IoT Greengrass extends AWS IoT capabilities to run compute and messaging locally on edge devices, a complementary but different role.",
"Wrong — Kinesis processes streaming data generally, but isn't the device connectivity and management layer IoT Core provides.",
"Wrong — EventBridge routes events between applications and services; it isn't a device connectivity service for IoT."
]},
{domain:"tech", q:"Which of the following is a key component of an Amazon VPC that controls how traffic is routed to and from the internet?", options:[

"A subnet",
"An IAM role",
], exp:[

"Wrong — a security group is a virtual firewall controlling traffic to individual resources, not the VPC's internet connectivity point.",
"Wrong — a subnet is a range of IP addresses within a VPC; it doesn't itself provide internet connectivity.",
"Wrong — an IAM role grants permissions to identities or services; it has no role in routing network traffic."
]},
{domain:"tech", q:"Which service lets you create, publish, and manage APIs at scale, acting as a front door for applications to reach backend services such as Lambda?", options:[
"Amazon API Gateway",
"AWS AppSync",
"AWS Global Accelerator",
"Amazon Route 53",
], exp:[
"Correct — API Gateway lets you create and manage RESTful and WebSocket APIs that route requests to backend services like Lambda.",
"Wrong — AppSync is specifically for managed GraphQL APIs, a more specialized case than API Gateway's general-purpose API management.",
"Wrong — Global Accelerator optimizes network routing to endpoints; it isn't an API creation and management service.",
"Wrong — Route 53 handles DNS resolution, not the creation and management of application APIs."
]},

// ---------------- ADDITIONAL: BILLING, PRICING & SUPPORT ----------------
{domain:"billing", q:"What distinguishes an EC2 Dedicated Host from a Dedicated Instance?", options:[
"A Dedicated Host gives you visibility into and control over the specific physical server (useful for per-socket or per-core licensing), while a Dedicated Instance just guarantees dedicated hardware without that visibility",
"A Dedicated Host is always cheaper than a Dedicated Instance in every scenario",
"A Dedicated Instance can be shared with other AWS customers, while a Dedicated Host cannot",
"There is no meaningful difference between the two options",
], exp:[
"Correct — Dedicated Hosts provide server-level visibility and control (helpful for certain software licensing models), while Dedicated Instances just ensure dedicated hardware.",
"Wrong — relative pricing depends on usage patterns and commitment; a Dedicated Host isn't universally cheaper.",
"Wrong — by definition, both options mean your instances do not share physical hardware with other AWS accounts.",
"Wrong — the visibility and control over the physical server is a meaningful, real difference between the two options."
]},
{domain:"billing", q:"Which EC2 purchasing option reserves compute capacity in a specific Availability Zone for a chosen duration, without requiring a long-term billing commitment?", options:[
"On-Demand Capacity Reservations",
"Standard Reserved Instances",
"Spot Instances",
"Savings Plans",
], exp:[
"Correct — Capacity Reservations let you reserve capacity in an AZ for as long as you need, billed at On-Demand rates without a multi-year commitment.",
"Wrong — Reserved Instances require a 1- or 3-year term commitment in exchange for a discount.",
"Wrong — Spot Instances use spare capacity at a discount but offer no capacity guarantee and can be interrupted.",
"Wrong — Savings Plans provide a usage-based discount tied to a spend commitment, not a specific-AZ capacity guarantee."
]},
{domain:"billing", q:"Which of the following describes a flexibility feature of Reserved Instances?", options:[
"Standard RIs can be sold on the Reserved Instance Marketplace, and Convertible RIs can be exchanged for a different instance type during the term",
"All Reserved Instances can be canceled at any time with a full refund",
"Reserved Instances automatically upgrade to the newest instance generation for free",
"Reserved Instances cannot be modified or exchanged in any way once purchased",
], exp:[
"Correct — Standard RIs offer marketplace resale, and Convertible RIs can be exchanged for different instance attributes, giving customers flexibility.",
"Wrong — Reserved Instances are a commitment; full refunds on cancellation are not a standard feature.",
"Wrong — moving to a new instance generation typically requires an active exchange (for Convertible RIs) rather than an automatic free upgrade.",
"Wrong — Convertible RIs specifically allow exchanges, contradicting the claim that RIs can never be modified."
]},
{domain:"billing", q:"In AWS Organizations with consolidated billing, how are Reserved Instance discounts typically shared?", options:[
"RI discounts can be shared across accounts in the organization that have matching, unused instance usage",
"RI discounts apply only to the single account that purchased them, with no exceptions",
"RIs cannot be used at all within AWS Organizations",
"RI discounts must be manually reassigned account-by-account every single day",
], exp:[
"Correct — consolidated billing allows RI discounts to automatically apply to matching usage across accounts in the organization.",
"Wrong — sharing across accounts with matching usage is one of the benefits consolidated billing provides for RIs.",
"Wrong — RIs are fully supported and commonly used within AWS Organizations.",
"Wrong — the sharing of RI discounts across matching usage happens automatically, not through manual daily reassignment."
]},
{domain:"billing", q:"Which type of AWS data transfer is typically free of charge?", options:[
"Data transferred INTO AWS from the internet",
"Data transferred OUT to the internet",
"Data transferred between AWS Regions",
"Data transferred between Availability Zones in some configurations",
], exp:[
"Correct — data transfer into AWS from the internet is generally free, while outbound data transfer and cross-Region/cross-AZ transfer typically incur charges.",
"Wrong — outbound data transfer to the internet is one of the more common categories of data transfer charges.",
"Wrong — transferring data between Regions typically incurs a per-GB charge.",
"Wrong — depending on the setup, cross-AZ data transfer can also incur charges, unlike inbound-from-internet transfer."
]},
{domain:"billing", q:"Which service lets managed service providers and enterprises customize their own internal cost and usage reporting or pricing structures for different business units?", options:[
"AWS Billing Conductor",
"AWS Cost Explorer",
"AWS Budgets",
"AWS Pricing Calculator",
], exp:[
"Correct — Billing Conductor lets organizations create custom billing groups and pricing structures to reflect internal chargeback needs.",
"Wrong — Cost Explorer visualizes actual AWS spend and usage trends, but doesn't let you build custom internal pricing structures.",
"Wrong — Budgets sets alerts on spend and usage thresholds, not custom internal pricing configurations.",
"Wrong — the Pricing Calculator estimates costs before deployment; it doesn't manage internal billing structures after the fact."
]},
{domain:"billing", q:"What is the purpose of AWS cost allocation tags?", options:[
"To label resources with metadata, such as project or department, so costs can be tracked and organized in billing reports",
"To encrypt billing data so only authorized users can view it",
"To automatically grant IAM permissions based on resource tags",
"To enable Reserved Instance discounts on tagged resources only",
], exp:[
"Correct — cost allocation tags let you categorize AWS costs (for example, by project, team, or environment) for more granular reporting.",
"Wrong — tags are not an encryption mechanism; billing data security is handled separately.",
"Wrong — while tags can be referenced in IAM policy conditions, that's a distinct use case from cost allocation itself.",
"Wrong — RI discounts apply based on instance attributes and usage matching, not based on whether a resource is tagged."
]},
{domain:"billing", q:"Which report provides the most comprehensive, granular set of AWS cost and usage data, often used for detailed analysis or ingestion into BI tools?", options:[
"AWS Cost and Usage Report (CUR)",
"AWS Cost Explorer",
"AWS Budgets",
"AWS Trusted Advisor",
], exp:[
"Correct — the Cost and Usage Report provides the most detailed, line-item level billing data available, ideal for deep analysis.",
"Wrong — Cost Explorer offers visual summaries and trends, but with less granularity than the full CUR dataset.",
"Wrong — Budgets is focused on alerting against thresholds, not providing granular historical usage data.",
"Wrong — Trusted Advisor gives best-practice recommendations, not detailed line-item billing data."
]},
{domain:"billing", q:"Which AWS Support plan is included automatically and free with every AWS account, providing access to customer service, documentation, and community support?", options:[

], exp:[

"Wrong — Enterprise Support is the highest paid tier, including a Technical Account Manager."
]},
{domain:"billing", q:"Which AWS Support plan is intended for customers experimenting or developing on AWS, offering business-hours email access to Cloud Support Associates?", options:[

], exp:[

{domain:"billing", q:"Which AWS Support plan provides 24/7 access to Cloud Support Engineers via phone, chat, and email, intended for customers running production workloads?", options:[

]},
{domain:"billing", q:"Which AWS Support plan is designed as an entry point to proactive guidance for customers who need some, but not all, of the benefits of full Enterprise Support?", options:[

"Business Support",

]},
{domain:"billing", q:"Which tool provides alerts and remediation guidance specifically when AWS operational issues may affect your own resources?", options:[

], exp:[

"Wrong — Trusted Advisor checks your account against best practices; it isn't focused on personalized operational-issue alerts.",

"Wrong — the general Service Health Dashboard shows overall AWS service status, not alerts personalized to your specific account and resources."
]},
{domain:"billing", q:"Which AWS team should you contact to report suspected abuse of AWS resources, such as spam or malware originating from an AWS-hosted resource?", options:[

{domain:"billing", q:"Which of the following is a benefit of becoming an AWS Partner through the AWS Partner Network (APN)?", options:[

{domain:"billing", q:"A company needs hands-on expert guidance to help design and implement a complex migration project. Which AWS offering provides this kind of direct technical assistance?", options:[

]},

// ---------------- BATCH 2: CLOUD CONCEPTS ----------------
{domain:"concepts", q:"A team wants to define and provision AWS infrastructure using version-controlled, repeatable code rather than manually clicking through a console each time. Which approach does this describe?", options:[
"Infrastructure as code (IaC), such as using AWS CloudFormation",
"Using the AWS Management Console exclusively for every deployment",
"Making one-time manual API calls with no saved record of them",
"Disabling automation so every change requires a human click",
], exp:[
"Correct — IaC lets you define infrastructure in version-controlled templates that can be reviewed, repeated, and reproduced consistently.",
"Wrong — relying solely on manual console clicks is exactly the repetitive, error-prone approach IaC is meant to replace.",
"Wrong — one-off, unrecorded API calls aren't repeatable or version-controlled, unlike IaC.",
"Wrong — IaC is about enabling automation, not disabling it."
]},
{domain:"concepts", q:"A team needs to make a single, one-off configuration change to a resource for a quick test. Which access method is generally most appropriate for this specific case?", options:[
"The AWS Management Console, for a quick manual one-time change",
"Building a full CloudFormation pipeline just for this one change",
"Writing a custom SDK application solely for this one change",
"Provisioning a dedicated CI/CD pipeline for this one change",
], exp:[
"Correct — for a quick, one-time action, the console's point-and-click interface is usually the fastest, simplest option.",
"Wrong — building a full IaC pipeline is overkill for a single one-off change and better suited to repeatable processes.",
"Wrong — writing custom SDK code adds unnecessary overhead for a single manual action.",
"Wrong — a full CI/CD pipeline is designed for repeatable deployments, not a single ad hoc change."
]},
{domain:"concepts", q:"Which of the following is NOT one of AWS's primary options for connecting an on-premises network to AWS?", options:[
"A physical USB cable connected directly to an EC2 instance",
"AWS Direct Connect",
"An AWS Site-to-Site VPN",
"The public internet",
], exp:[
"Correct — this isn't a real AWS connectivity option; EC2 instances are accessed over the network, not via a direct physical USB connection from on-premises.",
"Wrong — Direct Connect is a real, dedicated network connectivity option between on-premises and AWS.",
"Wrong — Site-to-Site VPN is a real, encrypted connectivity option over the public internet.",
"Wrong — the public internet is a legitimate, if less secure and less consistent, way to reach AWS services."
]},
{domain:"concepts", q:"Which AWS service helps an organization inventory its on-premises servers and applications to plan a migration before it begins?", options:[
"AWS Application Discovery Service",
"AWS Application Migration Service",
"AWS Database Migration Service (AWS DMS)",
"AWS Schema Conversion Tool (AWS SCT)",
], exp:[
"Correct — Application Discovery Service collects configuration and usage data from on-premises servers to help plan a migration.",
"Wrong — Application Migration Service performs the actual lift-and-shift migration, not the upfront discovery and inventory step.",
"Wrong — DMS migrates databases specifically, not general server/application discovery.",
"Wrong — SCT converts database schemas between engines; it doesn't inventory on-premises servers."
]},
{domain:"concepts", q:"Which service automates lift-and-shift migration of physical, virtual, and cloud servers to AWS with minimal downtime?", options:[
"AWS Application Migration Service (AWS MGN)",
"AWS Application Discovery Service",
"AWS Database Migration Service (AWS DMS)",
"AWS Snowball",
], exp:[
"Correct — Application Migration Service (MGN) is AWS's recommended service for automated lift-and-shift server migration.",
"Wrong — Application Discovery Service inventories servers for planning; it doesn't perform the migration itself.",
"Wrong — DMS is scoped to database migration, not general server migration.",
"Wrong — Snowball is a physical device for bulk offline data transfer, not an automated server migration service."
]},
{domain:"concepts", q:"Which member of the AWS Snow Family is a small, portable, ruggedized device suited for edge computing and data collection in space-constrained or disconnected environments?", options:[
"AWS Snowcone",
"AWS Snowball Edge",
"AWS Direct Connect",
"AWS Storage Gateway",
], exp:[
"Correct — Snowcone is the smallest, most portable member of the Snow Family, designed for tight spaces and edge use cases.",
"Wrong — Snowball Edge offers more capacity and compute but is larger and less portable than Snowcone.",
"Wrong — Direct Connect is a dedicated network link, not a physical edge computing device.",
"Wrong — Storage Gateway is a software/virtual appliance bridging on-premises storage to AWS, not a portable physical edge device."
]},

// ---------------- BATCH 2: SECURITY AND COMPLIANCE ----------------
{domain:"security", q:"Within AWS Organizations, what is the purpose of grouping accounts into Organizational Units (OUs)?", options:[
"To apply consistent policies, such as SCPs, to multiple accounts at once based on their function or environment",
"To merge multiple AWS accounts into a single account",
"To automatically encrypt every resource in every account within the OU",
"To eliminate the need for IAM policies within member accounts",
], exp:[
"Correct — OUs let you organize accounts (for example, by team or environment) so you can apply shared SCPs and governance consistently.",
"Wrong — OUs group accounts logically; they don't merge separate accounts into one.",
"Wrong — grouping accounts into an OU doesn't automatically configure encryption on resources within them.",
"Wrong — IAM policies are still required within each account; SCPs only set the outer permission ceiling."
]},
{domain:"security", q:"Compliance requirements can vary between AWS services. Where should you check to confirm whether a specific AWS service is covered by a particular compliance program before using it for a regulated workload?", options:[
"AWS Artifact and the service-specific compliance scope documentation",
"Assume every AWS service has identical compliance coverage",
"Only the AWS Trusted Advisor dashboard",
"Only the AWS service's pricing page",
], exp:[
"Correct — AWS Artifact and AWS's published compliance scope documentation specify which services are covered by which certifications.",
"Wrong — compliance coverage does vary by service, so this assumption could lead to a serious regulatory gap.",
"Wrong — Trusted Advisor checks best practices and cost/performance/security basics, not detailed per-service compliance scope.",
"Wrong — a pricing page describes costs, not compliance certification coverage."
]},

// ---------------- BATCH 2: CLOUD TECHNOLOGY AND SERVICES ----------------
{domain:"tech", q:"Which service lets you run hundreds or thousands of batch computing jobs efficiently, automatically provisioning the optimal compute resources based on job requirements?", options:[

"AWS Lambda",

"AWS Step Functions",
], exp:[

"Wrong — EC2 Auto Scaling adjusts general compute capacity but doesn't provide batch job queuing and scheduling itself.",
"Wrong — Step Functions orchestrates workflow steps; it doesn't provision compute for batch jobs the way AWS Batch does."
]},
{domain:"tech", q:"Which service provides a fully managed Docker container registry for storing, managing, and deploying container images?", options:[
"Amazon Elastic Container Registry (Amazon ECR)",
"Amazon Elastic Container Service (Amazon ECS)",
"Amazon Elastic Kubernetes Service (Amazon EKS)",
"AWS Fargate",

"Wrong — EKS runs Kubernetes-orchestrated containers; it doesn't provide image storage either.",
"Wrong — Fargate provides serverless compute for running containers, not a registry for storing images."

{domain:"tech", q:"Which service is a fully managed graph database well suited for applications like social networking or recommendation engines with highly connected data?", options:[

"Amazon Aurora",
"Amazon Redshift",
], exp:[

"Wrong — DynamoDB is a key-value/document NoSQL database, not optimized for graph relationship queries.",
"Wrong — Aurora is a relational database, not designed around graph relationship traversal.",
"Wrong — Redshift is a data warehouse for analytical queries, not a graph database."
]},
{domain:"tech", q:"Which service lets you safely deploy application configuration changes and feature flags separately from your application code, with built-in validation and rollback?", options:[

"AWS CodeDeploy",

"Wrong — CodeDeploy deploys application code/artifacts, not configuration values and feature flags specifically."

{domain:"tech", q:"A developer wants to automate AWS resource management from within a Python application. Which access method should they use?", options:[

"AWS CloudShell",
"An AWS Site-to-Site VPN",

"Wrong — CloudShell provides an interactive browser-based command-line shell, not an embeddable application library.",
"Wrong — a Site-to-Site VPN is a network connectivity option, unrelated to programmatic access from application code."
]},
{domain:"tech", q:"Which service provides a fully managed artifact repository for storing and sharing software packages and dependencies used in builds?", options:[

"Wrong — ECR stores container images specifically, not general software packages and build dependencies."
]},
{domain:"tech", q:"Which service provides low-cost, browser-based access to internal web applications without needing a full virtual desktop or installed client software?", options:[

"AWS Amplify",

{domain:"tech", q:"Which service lets you test mobile and web applications across a wide range of real physical devices in the cloud?", options:[

"AWS Amplify",
"AWS CodeBuild",

"Wrong — CodeBuild compiles and tests code logic, not UI behavior across real physical devices."
]},
{domain:"tech", q:"Which service extends AWS IoT capabilities to edge devices, letting them run local compute, messaging, and machine learning inference even with intermittent cloud connectivity?", options:[

"Amazon Kinesis",
"AWS Wavelength",

{domain:"tech", q:"Which service automatically translates text from one language into another using machine learning?", options:[

"Amazon Transcribe",
"Amazon Polly",

{domain:"tech", q:"Which free tool lets you review your workloads against the AWS Well-Architected Framework's pillars and get tailored improvement recommendations?", options:[

{domain:"tech", q:"Which service analyzes historical utilization metrics and recommends optimal AWS resource configurations, such as rightsized EC2 instance types?", options:[

"Amazon CloudWatch",
"AWS Budgets",

{domain:"tech", q:"Which service helps set up and govern a secure, multi-account AWS environment based on best-practice blueprints, building on top of AWS Organizations?", options:[

{domain:"tech", q:"Which service helps track and manage software licenses (such as for Microsoft or Oracle products) across AWS and on-premises environments to avoid non-compliance?", options:[

"AWS Marketplace",
"AWS Artifact",
"AWS Systems Manager",

"Wrong — Systems Manager provides general operational management tools, not specialized license tracking."

{domain:"tech", q:"Which service provides a guided way to size, configure, and deploy third-party enterprise applications (such as SAP or Microsoft SQL Server) on AWS without manually designing the underlying architecture?", options:[
"AWS Launch Wizard",
"AWS CloudFormation",
"AWS Service Catalog",
"AWS Elastic Beanstalk",
], exp:[

"Wrong — Elastic Beanstalk deploys custom application code, not specific pre-packaged third-party enterprise software."
]},
{domain:"tech", q:"Which tool lets you view and manage a custom collection of AWS resources based on tags, across multiple services, from a single place?", options:[
"AWS Resource Groups and Tag Editor",
"AWS Config",
"AWS Organizations",

const DOMAIN_META = {
  concepts: {label:"Cloud Concepts", weight:24},

const STORAGE_KEY = "ccp_drill_stats_v1";
function loadStats(){
  let s = {attempts:{}, missed:{}, examHistory:[]};
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) s = Object.assign(s, JSON.parse(raw));
  }catch(e){}
  if(!s.attempts) s.attempts = {};
  if(!s.missed) s.missed = {};
  if(!s.examHistory) s.examHistory = [];
  return s;
}
function saveStats(s){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){}
}
let stats = loadStats();

const FULL_SESSION_LEN = 65;
const QUICK_LEN_OPTIONS = [5, 10, 20, 40];
let quickLen = 10;

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function pickLeastSeen(pool, n){
  const shuffled = shuffleArr(pool.slice());
  shuffled.sort((a,b)=>{
    const seenA = (stats.attempts[a.id]&&stats.attempts[a.id].seen) || 0;
    const seenB = (stats.attempts[b.id]&&stats.attempts[b.id].seen) || 0;
    return seenA - seenB;
  });
  return shuffled.slice(0, Math.min(n, shuffled.length));
}

QUESTIONS.forEach((q,i)=>{ q.id = q.domain+"_"+i; });

function shuffledQuestion(q){
  const idx = shuffleArr([0,1,2,3]);
  return {
    id:q.id, domain:q.domain, qtext:q.q,
    options: idx.map(i=>q.options[i]),
    exp: idx.map(i=>q.exp[i]),
    correct: idx.indexOf(0)
  };
}

let session = null;
const mainEl = document.getElementById("main");
const backBtn = document.getElementById("backBtn");
const brandLabel = document.getElementById("brandLabel");
backBtn.addEventListener("click", ()=>(window.backAction||renderHome)());

function domainPct(domain){
  const qs = QUESTIONS.filter(q=>q.domain===domain);
  let correct=0, attempted=0;
  qs.forEach(q=>{
    const a = stats.attempts[q.id];
    if(a){ attempted++; if(a.lastCorrect) correct++; }
  });
  if(attempted===0) return 0;
  return Math.round((correct/attempted)*100);
}

function overallPct(){
  let correct=0, attempted=0;
  QUESTIONS.forEach(q=>{
    const a = stats.attempts[q.id];
    if(a){ attempted++; if(a.lastCorrect) correct++; }
  });
  if(attempted===0) return 0;
  return Math.round((correct/attempted)*100);
}

      <p>${Math.min(FULL_SESSION_LEN, QUESTIONS.length)} questions, no answers revealed until the end — just like the real thing. Finish for a pass/fail score against the 700/1000 bar.</p>
      <button class="primarybtn" id="startExam">Start full exam &rarr;</button>

    </div>

    .concat(Object.keys(DOMAIN_META).map(d=>({key:d, label:DOMAIN_META[d].label, count:QUESTIONS.filter(q=>q.domain===d).length, sub:DOMAIN_META[d].weight+"% of exam"})));
  rows.forEach(r=>{
    const pct = r.key==="all" ? overallPct() : domainPct(r.key);
    const row = document.createElement("button");
    row.className = "domainrow";
    row.innerHTML = `
      <div class="ring" style="--pct:${pct}" data-pct="${pct}"></div>

        <div class="name">${r.label}</div>

function startSession(mode, opts){
  opts = opts || {examMode:false, length:FULL_SESSION_LEN};
  let pool;
  if(mode==="missed"){
    pool = shuffleArr(QUESTIONS.filter(q=>stats.missed[q.id]));
  } else if(mode==="all"){
    pool = pickLeastSeen(QUESTIONS, opts.length);
  } else {
    pool = pickLeastSeen(QUESTIONS.filter(q=>q.domain===mode), opts.length);
  }

  session = {
    mode,
    opts,
    examMode: !!opts.examMode,
    order: pool.map(shuffledQuestion),
    index: 0,
    score: 0,
    answered: [],
    domainTotals: {},
    domainCorrect: {},
    pendingIdx: null,
    locked: false
  };
  session.order.forEach(q=>{
    session.domainTotals[q.domain] = (session.domainTotals[q.domain]||0)+1;
  });

  backBtn.style.display = "flex";
  brandLabel.textContent = opts.examMode ? "FULL EXAM" : mode==="missed" ? "REVIEW MISSED" : mode==="all" ? "QUICK PRACTICE" : DOMAIN_META[mode].label.toUpperCase();
  renderQuestion();
}

function recordAnswer(q, chosenIdx){
  const isCorrect = chosenIdx === q.correct;
  session.answered.push({id:q.id, correct:isCorrect, chosenIdx});
  if(isCorrect) session.score++;
  session.domainCorrect[q.domain] = (session.domainCorrect[q.domain]||0) + (isCorrect?1:0);

  stats.attempts[q.id] = stats.attempts[q.id] || {seen:0,correctCount:0};
  stats.attempts[q.id].seen++;
  if(isCorrect) stats.attempts[q.id].correctCount++;
  stats.attempts[q.id].lastCorrect = isCorrect;
  if(isCorrect) delete stats.missed[q.id];
  else stats.missed[q.id] = true;
  saveStats(stats);
  return isCorrect;
}

function renderQuestion(){
  const total = session.order.length;
  const q = session.order[session.index];
  const meta = DOMAIN_META[q.domain];
  session.locked = false;
  session.pendingIdx = null;

  const screen = document.createElement("div");
  screen.className = "screen";
  screen.innerHTML = `
    <div class="progresswrap">
      <div class="progressmeta"><span>Question ${session.index+1} / ${total}</span><span>${session.examMode ? "No peeking until the end" : "Score "+session.score+"/"+session.answered.length}</span></div>
      <div class="progressbar"><div style="width:${((session.index)/total)*100}%"></div></div>
    </div>
    <div class="chip">${meta.label}</div>
    <div class="qtext">${q.qtext}</div>
    <div class="options" id="optionsWrap"></div>
    <div class="footerbar" id="footerBar" style="display:none;">
      <button class="primarybtn" id="nextBtn"></button>
    </div>
  `;
  mainEl.innerHTML = "";
  mainEl.appendChild(screen);

  const wrap = document.getElementById("optionsWrap");
  const letters = ["A","B","C","D"];
  q.options.forEach((opt,i)=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = session.examMode ? `
      <div class="row">
        <div class="letter">${letters[i]}</div>
        <div class="otext">${opt}</div>
      </div>
    ` : `
      <div class="row">
        <div class="letter">${letters[i]}</div>
        <div class="otext">${opt}</div>
      </div>
      <div class="explain">${q.exp[i]}</div>
    `;
    btn.addEventListener("click", ()=> session.examMode ? selectOption(i) : lockAnswer(i));
    wrap.appendChild(btn);
  });
}

function selectOption(idx){
  session.pendingIdx = idx;
  const options = document.querySelectorAll("#optionsWrap .option");
  options.forEach((el,i)=>{ el.classList.toggle("selected", i===idx); });

  const footer = document.getElementById("footerBar");
  const nextBtn = document.getElementById("nextBtn");
  const isLast = session.index === session.order.length - 1;
  nextBtn.textContent = isLast ? "Submit exam →" : "Next question →";
  footer.style.display = "block";
  nextBtn.onclick = ()=> examAdvance();
}

function examAdvance(){
  const q = session.order[session.index];
  recordAnswer(q, session.pendingIdx);
  const isLast = session.index === session.order.length - 1;
  if(isLast){ renderResults(); }
  else { session.index++; renderQuestion(); }
}

function lockAnswer(chosenIdx){
  if(session.locked) return;
  session.locked = true;
  const q = session.order[session.index];
  const options = document.querySelectorAll("#optionsWrap .option");
  recordAnswer(q, chosenIdx);

  options.forEach((el,i)=>{
    el.classList.add("locked");
    el.style.cursor = "default";
    if(i===q.correct) el.classList.add("correct");
    else if(i===chosenIdx) el.classList.add("incorrect");
  });

  const footer = document.getElementById("footerBar");
  const nextBtn = document.getElementById("nextBtn");
  const isLast = session.index === session.order.length - 1;
  nextBtn.textContent = isLast ? "See results →" : "Next question →";
  footer.style.display = "block";
  nextBtn.onclick = ()=>{
    if(isLast){ renderResults(); }
    else { session.index++; renderQuestion(); }
  };

  const optWrap = document.getElementById("optionsWrap");
  optWrap.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function renderResults(){
  backBtn.style.display = "flex";
  brandLabel.textContent = session.examMode ? "EXAM RESULTS" : "RESULTS";
  const total = session.order.length;
  const pct = Math.round((session.score/total)*100);
  const scaled = Math.round(100 + (pct/100)*900);
  const passed = pct >= 72;

  if(session.examMode){
    stats.examHistory = stats.examHistory || [];
    stats.examHistory.unshift({date:Date.now(), score:session.score, total, pct, passed});
    stats.examHistory = stats.examHistory.slice(0, 20);
    saveStats(stats);
  }

  const screen = document.createElement("div");
  screen.className = "screen";

  let breakdownHtml = "";
  Object.keys(session.domainTotals).forEach(d=>{
    const c = session.domainCorrect[d]||0;
    const t = session.domainTotals[d];
    const p = Math.round((c/t)*100);
    breakdownHtml += `
      <div class="breakdownrow">
        <div class="toplbl"><span>${DOMAIN_META[d].label}</span><span class="mono">${c}/${t}</span></div>
        <div class="track"><div class="fill" style="width:${p}%"></div></div>
      </div>
    `;
  });

  let reviewHtml = "";
  if(session.examMode){
    reviewHtml = `<div class="card"><h2>Review your answers</h2><div class="missedlist">` +
      session.order.map((q,i)=>{
        const a = session.answered[i];
        const gotIt = !!(a && a.correct);
        return `
          <div class="missedcard">
            <div class="examreviewtag ${gotIt?'tagcorrect':'tagwrong'}">${gotIt ? "Correct" : "Missed"}</div>
            <div class="mq">${q.qtext}</div>
            ${gotIt ? "" : `<div class="mywrong">Your answer: ${q.options[a.chosenIdx]}</div>`}
            <div class="ma">Correct: ${q.options[q.correct]}</div>
          </div>
        `;
      }).join("") + `</div></div>`;
  } else {
    const missedIds = session.answered.filter(a=>!a.correct).map(a=>a.id);
    const missedQs = session.order.filter(q=>missedIds.includes(q.id));
    if(missedQs.length){
      reviewHtml = `<div class="card"><h2>Review what you missed</h2><div class="missedlist">` +
        missedQs.map(q=>`
          <div class="missedcard">
            <div class="mq">${q.qtext}</div>
            <div class="ma">Correct: ${q.options[q.correct]}</div>
          </div>
        `).join("") + `</div></div>`;
    }
  }

  const verdictText = session.examMode
    ? (passed ? "PASS" : "FAIL")
    : (passed ? "Passing pace" : "Below pass line (700/1000)");
  const retryLabel = session.examMode ? "Retake full exam" : "Practice again";

  screen.innerHTML = `
    <div class="scorehero">
      <div class="eyebrow">${session.examMode ? "Exam complete" : "Session complete"}</div>
      ${session.examMode ? `<div class="attemptno">Attempt #${stats.examHistory.length}</div>` : ``}
      <div class="scorebig mono">${pct}%</div>
      <p style="color:var(--text-dim);">${session.score} of ${total} correct &middot; approx. scaled score ${scaled}/1000</p>
      <div class="scoreverdict ${passed?'pass':'fail'}">${verdictText}</div>
    </div>
    <div class="card" style="gap:14px;">
      <h2>By domain</h2>
      ${breakdownHtml}
    </div>
    ${reviewHtml}
    <button class="primarybtn" id="retryBtn">${retryLabel}</button>
    <button class="ghostbtn" id="homeBtn2">Back to home</button>
  `;
  mainEl.innerHTML = "";
  mainEl.appendChild(screen);

  document.getElementById("retryBtn").addEventListener("click", ()=>startSession(session.mode, session.opts));
  document.getElementById("homeBtn2").addEventListener("click", ()=>renderHome());
}

renderHome();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
