<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud Practitioner Drill</title>
<meta name="description" content="Practice quiz app for the AWS Certified Cloud Practitioner (CLF-C02) exam, with a full exam simulation and quick practice rounds.">
<meta name="theme-color" content="#12151b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCP Drill">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f3f1ea;
    --surface:#ffffff;
    --surface-2:#eae5d8;
    --text:#1b1e24;
    --text-dim:#5d6270;
    --border:#ddd6c4;
    --accent:#c2660a;
    --accent-ink:#fffaf2;
    --accent-soft:#f3ddc0;
    --good:#146b52;
    --good-bg:#e0f1e8;
    --good-border:#bfe0cd;
    --bad:#a92b21;
    --bad-bg:#fbe8e5;
    --bad-border:#f0c6bf;
    --shadow: 0 20px 50px -25px rgba(30,20,0,0.35);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151b;
      --surface:#1b1f27;
      --surface-2:#242a34;
      --text:#eae7de;
      --text-dim:#98a0ad;
      --border:#2c313d;
      --accent:#f0a234;
      --accent-ink:#1c1400;
      --accent-soft:#3a2a10;
      --good:#3fcf9e;
      --good-bg:#123028;
      --good-border:#1e4a3d;
      --bad:#ff7166;
      --bad-bg:#3a1613;
      --bad-border:#5a231d;
      --shadow: 0 20px 50px -25px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151b;
    --surface:#1b1f27;
    --surface-2:#242a34;
    --text:#eae7de;
    --text-dim:#98a0ad;
    --border:#2c313d;
    --accent:#f0a234;
    --accent-ink:#1c1400;
    --accent-soft:#3a2a10;
    --good:#3fcf9e;
    --good-bg:#123028;
    --good-border:#1e4a3d;
    --bad:#ff7166;
    --bad-bg:#3a1613;
    --bad-border:#5a231d;
    --shadow: 0 20px 50px -25px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:24px 12px 48px;
  }
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}
  #app{
    width:100%;
    max-width:430px;
    display:flex;
    flex-direction:column;
    min-height:calc(100vh - 72px);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:28px;
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 18px 14px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    position:sticky;
    top:0;
    z-index:5;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:0.95rem;
    letter-spacing:0.01em;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .backbtn{
    border:none;background:transparent;color:var(--text-dim);
    font-family:"IBM Plex Mono",monospace;font-size:0.85rem;
    cursor:pointer;padding:6px 8px;margin-left:-8px;border-radius:8px;
    display:flex;align-items:center;gap:4px;
  }
  .backbtn:hover{background:var(--surface-2);color:var(--text);}
  main{flex:1;display:flex;flex-direction:column;padding:20px 18px 100px;gap:18px;}
  .screen{display:flex;flex-direction:column;gap:18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

  h1{font-size:1.5rem;line-height:1.2;margin:0 0 4px;letter-spacing:-0.01em;text-wrap:balance;}
  h2{font-size:1.05rem;margin:0;letter-spacing:-0.01em;}
  p{margin:0;color:var(--text-dim);font-size:0.92rem;line-height:1.5;}
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--accent);
    font-weight:600;
  }

  .factrow{display:flex;gap:8px;}
  .fact{
    flex:1;background:var(--surface-2);border:1px solid var(--border);
    border-radius:12px;padding:10px 8px;text-align:center;
  }
  .fact .num{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:1.15rem;display:block;font-variant-numeric:tabular-nums;}
  .fact .lbl{font-size:0.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;}

  .card{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .domaingrid{display:flex;flex-direction:column;gap:10px;}
  .domainrow{
    display:flex;align-items:center;gap:12px;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:14px;padding:12px 14px;cursor:pointer;
    text-align:left;width:100%;font-family:inherit;color:inherit;
    transition:border-color .15s ease, transform .1s ease;
  }
  .domainrow:hover{border-color:var(--accent);}
  .domainrow:active{transform:scale(0.99);}
  .ring{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--border) 0);
  }
  .ring::after{
    content:attr(data-pct)"%";
    width:34px;height:34px;border-radius:50%;background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    font-family:"IBM Plex Mono",monospace;font-size:0.62rem;font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .domaininfo{flex:1;min-width:0;}
  .domaininfo .name{font-weight:600;font-size:0.92rem;}
  .domaininfo .meta{font-size:0.75rem;color:var(--text-dim);font-family:"IBM Plex Mono",monospace;}
  .chev{color:var(--text-dim);font-size:1.1rem;}

  .primarybtn{
    background:var(--accent);color:var(--accent-ink);border:none;
    border-radius:14px;padding:15px 18px;font-size:0.95rem;font-weight:600;
    font-family:"IBM Plex Sans",sans-serif;cursor:pointer;width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:filter .15s ease, transform .1s ease;
  }
  .primarybtn:hover{filter:brightness(1.06);}
  .primarybtn:active{transform:scale(0.98);}
  .primarybtn:disabled{opacity:0.4;cursor:not-allowed;}
  .ghostbtn{
    background:transparent;color:var(--text);border:1px solid var(--border);
    border-radius:14px;padding:13px 18px;font-size:0.88rem;font-weight:500;
    font-family:"IBM Plex Sans",sans-serif;cursor:pointer;width:100%;
  }
  .ghostbtn:hover{border-color:var(--accent);color:var(--accent);}
  .linkbtn{
    background:none;border:none;color:var(--text-dim);text-decoration:underline;
    text-underline-offset:3px;font-size:0.8rem;cursor:pointer;font-family:inherit;
    padding:4px;align-self:center;
  }

  /* Quiz screen */
  .progresswrap{display:flex;flex-direction:column;gap:6px;}
  .progressmeta{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:0.72rem;color:var(--text-dim);}
  .progressbar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
  .progressbar>div{height:100%;background:var(--accent);border-radius:4px;transition:width .3s ease;}
  .chip{
    align-self:flex-start;
    font-family:"IBM Plex Mono",monospace;font-size:0.68rem;font-weight:600;
    text-transform:uppercase;letter-spacing:0.06em;
    background:var(--accent-soft);color:var(--accent);
    padding:5px 10px;border-radius:20px;
  }
  .qtext{font-size:1.12rem;line-height:1.45;font-weight:500;text-wrap:balance;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;flex-direction:column;gap:8px;
    background:var(--surface);border:1.5px solid var(--border);
    border-radius:14px;padding:13px 14px;cursor:pointer;text-align:left;
    font-family:inherit;color:inherit;transition:border-color .15s ease, background .15s ease;
  }
  .option:hover:not(.locked){border-color:var(--accent);}
  .option .row{display:flex;align-items:flex-start;gap:10px;}
  .option .letter{
    font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:0.78rem;
    width:24px;height:24px;border-radius:7px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
  }
  .option .otext{font-size:0.9rem;line-height:1.4;padding-top:2px;}
  .option.correct{background:var(--good-bg);border-color:var(--good-border);}
  .option.correct .letter{background:var(--good);color:var(--good-bg);}
  .option.incorrect{background:var(--bad-bg);border-color:var(--bad-border);}
  .option.incorrect .letter{background:var(--bad);color:var(--bad-bg);}
  .option.locked{cursor:default;}
  .explain{
    font-size:0.82rem;line-height:1.5;color:var(--text-dim);
    border-top:1px dashed var(--border);padding-top:8px;margin-top:2px;
    display:none;
  }
  .option.locked .explain{display:block;}
  .option.correct .explain{color:var(--good);}
  .option.incorrect .explain{color:var(--bad);}

  .footerbar{
    position:sticky;bottom:0;left:0;right:0;
    background:linear-gradient(to top, var(--surface) 60%, transparent);
    padding:18px 18px 20px;margin-top:-30px;
  }

  /* Results */
  .scorehero{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:18px 0 6px;text-align:center;
  }
  .scorebig{font-family:"IBM Plex Mono",monospace;font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
  .scoreverdict{
    font-family:"IBM Plex Mono",monospace;font-size:0.75rem;text-transform:uppercase;
    letter-spacing:0.1em;font-weight:700;padding:4px 12px;border-radius:20px;
  }
  .scoreverdict.pass{background:var(--good-bg);color:var(--good);}
  .scoreverdict.fail{background:var(--bad-bg);color:var(--bad);}
  .breakdownrow{display:flex;flex-direction:column;gap:4px;}
  .breakdownrow .toplbl{display:flex;justify-content:space-between;font-size:0.82rem;}
  .breakdownrow .track{height:8px;border-radius:4px;background:var(--surface);overflow:hidden;}
  .breakdownrow .fill{height:100%;border-radius:4px;background:var(--accent);}
  .missedlist{display:flex;flex-direction:column;gap:8px;}
  .missedcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .missedcard .mq{font-size:0.85rem;font-weight:500;margin-bottom:6px;}
  .missedcard .ma{font-size:0.78rem;color:var(--good);}
  .examreviewtag{
    font-family:"IBM Plex Mono",monospace;font-size:0.65rem;font-weight:700;
    text-transform:uppercase;letter-spacing:0.06em;padding:2px 8px;border-radius:10px;
    display:inline-block;margin-bottom:6px;
  }
  .examreviewtag.tagcorrect{background:var(--good-bg);color:var(--good);}
  .examreviewtag.tagwrong{background:var(--bad-bg);color:var(--bad);}
  .mywrong{font-size:0.78rem;color:var(--bad);margin-bottom:2px;}
  .attemptno{font-family:"IBM Plex Mono",monospace;font-size:0.75rem;color:var(--text-dim);}

  .modecard{display:flex;flex-direction:column;gap:12px;}
  .modehead{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .modehead h2{display:flex;align-items:center;gap:8px;}
  .modeicon{
    width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);font-size:0.9rem;flex-shrink:0;
  }
  .examstats{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px dashed var(--border);}
  .examstatsrow{display:flex;justify-content:space-between;font-size:0.82rem;color:var(--text-dim);}
  .examstatsrow .good{color:var(--good);}
  .examstatsrow .bad{color:var(--bad);}
  .attemptdots{display:flex;gap:5px;margin-top:2px;flex-wrap:wrap;}
  .attemptdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .attemptdot.dotpass{background:var(--good);}
  .attemptdot.dotfail{background:var(--bad);}
  .lenlabel{font-size:0.78rem;color:var(--text-dim);}
  .lenchiprow{display:flex;gap:8px;}
  .lenchip{
    flex:1;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;
    padding:9px 0;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:0.85rem;
    cursor:pointer;color:var(--text-dim);
  }
  .lenchip:hover{border-color:var(--accent);}
  .lenchip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .option.selected{border-color:var(--accent);background:var(--accent-soft);}
  .option.selected .letter{background:var(--accent);color:var(--accent-ink);}

  ::selection{background:var(--accent-soft);}
  a{color:var(--accent);}
</style>

<body>

<div id="app">
  <header class="topbar">
    <button class="backbtn" id="backBtn" style="display:none;" aria-label="Back to home">&larr; <span>Home</span></button>
    <div class="brand"><span class="dot"></span><span id="brandLabel">CCP DRILL</span></div>
  </header>
  <main id="main"></main>
</div>

<script src="learn-data.js"></script>
<script src="learn-cards.js"></script>
<script src="learn.js"></script>
<script>
const QUESTIONS = [
// ---------------- CLOUD CONCEPTS ----------------
{domain:"concepts", q:"What is one of the main financial benefits AWS describes for moving to the cloud?", options:[
"Trading capital expense (upfront hardware purchases) for variable, pay-as-you-go expense",
"Eliminating the need for any IT staff whatsoever",
"A guarantee of zero ongoing operating costs",
"A requirement to purchase servers in bulk before deployment"
], exp:[
"Correct — instead of buying data centers and servers up front, you pay only for the compute and storage you actually consume.",
"Wrong — cloud reduces undifferentiated heavy lifting, but teams still need staff to design, secure, and operate workloads.",
"Wrong — you still pay for what you use; the benefit is variable cost, not free infrastructure.",
"Wrong — this describes the on-premises capital-expense model the cloud is meant to replace."
]},
{domain:"concepts", q:"Which Well-Architected Framework pillar focuses on running workloads effectively, gaining insight into operations, and continuously improving supporting processes?", options:[
"Operational Excellence",
"Security",
"Cost Optimization",
"Performance Efficiency"
], exp:[
"Correct — Operational Excellence covers automating changes, responding to events, and refining procedures over time.",
"Wrong — Security is about protecting information, systems, and assets through risk assessments and mitigation.",
"Wrong — Cost Optimization is about avoiding unnecessary costs and understanding spend over time.",
"Wrong — Performance Efficiency is about using computing resources efficiently and adapting as demand and technology change."
]},
{domain:"concepts", q:"What is an AWS Availability Zone (AZ)?", options:[
"One or more discrete data centers with redundant power, networking, and connectivity, located within an AWS Region",
"A single physical server rack",
"An entire country where AWS has a presence",
"A single data center with no backup power or redundancy"
], exp:[
"Correct — each Region is made up of multiple isolated, redundant AZs so failures in one don't take down the others.",
"Wrong — an AZ is made up of one or more full data centers, not a single rack.",
"Wrong — a Region is a geographic area; an AZ is a smaller unit inside that Region.",
"Wrong — AZs are specifically built with redundant power and networking for high availability."
]},
{domain:"concepts", q:"Which term describes the ability of a cloud environment to automatically acquire or release resources to match demand?", options:[
"Elasticity",
"Durability",
"Consistency",
"Idempotency"
], exp:[
"Correct — elasticity is the ability to scale compute, storage, or other resources up or down automatically as demand changes.",
"Wrong — durability refers to how reliably data is preserved over time (used to describe services like S3), not scaling.",
"Wrong — consistency describes whether reads reflect the latest writes in a data store.",
"Wrong — idempotency means an operation produces the same result no matter how many times it's performed; unrelated to scaling."
]},
{domain:"concepts", q:"A company moves an application to AWS with almost no code changes, simply relaunching it on EC2 instances. Which migration strategy does this describe?", options:[
"Rehost (\"lift and shift\")",
"Refactor / re-architect",
"Repurchase",
"Retire"
], exp:[
"Correct — rehosting moves an application as-is onto cloud infrastructure with minimal modification.",
"Wrong — refactoring means redesigning the application to take advantage of cloud-native features, which requires code changes.",
"Wrong — repurchasing means switching to a different product, typically a SaaS offering, not moving the same app.",
"Wrong — retiring means decommissioning an application that is no longer needed, not migrating it."
]},
{domain:"concepts", q:"What is a key advantage of AWS's multiple geographic Regions?", options:[
"Applications can be deployed closer to end users to reduce latency and meet data residency needs",
"All data transfer between Regions is automatically free",
"Regions automatically convert billing currency for local customers",
"Choosing a Region removes the customer's part of the shared responsibility model",
], exp:[
"Correct — running workloads in a Region near your users reduces latency, and Regions also help satisfy data sovereignty requirements.",
"Wrong — inter-Region data transfer is generally a billed cost, not free.",
"Wrong — Regions don't handle currency conversion; billing currency is a separate account setting.",
"Wrong — the shared responsibility model applies regardless of which Region you choose."
]},
{domain:"concepts", q:"What does \"economies of scale\" mean in AWS's cost model?", options:[
"As AWS's aggregate usage grows, it can operate more efficiently and pass savings on to customers through lower prices",
"Every customer is charged an identical flat monthly fee",
"Customers must build their own large data centers to get discounts",
"Only enterprise customers are eligible for any form of discount",
], exp:[
"Correct — AWS has historically lowered prices multiple times as its infrastructure and customer base have grown.",
"Wrong — pricing is usage-based, not a flat fee for everyone.",
"Wrong — the entire point of economies of scale is that customers don't need their own data centers.",
"Wrong — discounts such as Savings Plans, volume pricing, and Free Tier are available to accounts of many sizes."
]},
{domain:"concepts", q:"A startup wants to stop guessing infrastructure capacity months in advance. Which cloud characteristic solves this problem?", options:[
"The ability to scale resources up or down on demand instead of forecasting and over-provisioning hardware",
"A fixed, unchangeable allocation of servers",
"A mandatory multi-year hardware purchase contract",
"Vendor lock-in to a single instance type",
], exp:[
"Correct — cloud resources can be provisioned or released in minutes, removing the need to guess future capacity.",
"Wrong — a fixed allocation is exactly the on-premises problem the cloud helps avoid.",
"Wrong — AWS has no such requirement; usage is generally on-demand.",
"Wrong — AWS offers many instance types and services, and workloads are not locked to one option."
]},
{domain:"concepts", q:"Which deployment model involves keeping some infrastructure on-premises while connecting it to resources running in AWS?", options:[
"Hybrid deployment",
"Fully cloud-native deployment",
"On-premises-only deployment",
"Air-gapped deployment",
], exp:[
"Correct — a hybrid deployment integrates on-premises infrastructure (or a private cloud) with AWS, often using services like Direct Connect or VPN.",
"Wrong — a fully cloud-native deployment runs entirely in AWS with nothing kept on-premises.",
"Wrong — an on-premises-only model uses no public cloud resources at all.",
"Wrong — air-gapped describes a network with no external connectivity, not a hybrid AWS setup."
]},
{domain:"concepts", q:"What is an AWS edge location primarily used for?", options:[
"Caching content close to end users to reduce latency, for services such as Amazon CloudFront",
"Running the full compute capacity of an entire AWS Region",
"Hosting discounted, unmanaged EC2 instances",
"Storing IAM credentials for an account",
], exp:[
"Correct — edge locations are sites CloudFront (and other services) use to cache and deliver content closer to users.",
"Wrong — a Region's compute capacity runs in its data centers/AZs, not at edge locations.",
"Wrong — edge locations are content delivery endpoints, not EC2 compute infrastructure.",
"Wrong — IAM credentials are managed centrally by AWS IAM, not stored at edge locations."
]},
{domain:"concepts", q:"Which statement best describes \"agility\" as a cloud computing benefit?", options:[
"The ability to quickly provision, experiment with, and de-provision resources as business needs change",
"The physical distance in miles between two AWS Regions",
"A specific EC2 pricing discount tier",
"A compliance certification AWS holds",
], exp:[
"Correct — agility means teams can access new resources in minutes instead of waiting weeks for hardware, enabling faster experimentation.",
"Wrong — distance between Regions is a network/latency concept, unrelated to agility as a benefit.",
"Wrong — pricing tiers like Reserved Instances relate to cost optimization, not agility.",
"Wrong — compliance certifications are documented via AWS Artifact and are a separate topic from agility."
]},
{domain:"concepts", q:"During a migration, a company decides an old internal tool is no longer needed and shuts it down instead of moving it. Which of the \"6 R's\" migration strategies is this?", options:[
"Retire",
"Retain",
"Rehost",
"Repurchase",
], exp:[
"Correct — retiring means decommissioning applications identified as no longer useful.",
"Wrong — retain means keeping an application on-premises for now, e.g. revisiting it later, not shutting it down.",
"Wrong — rehost means moving the application to the cloud with minimal change, not decommissioning it.",
"Wrong — repurchase means replacing the application with a different product, typically a SaaS solution."
]},
{domain:"concepts", q:"Which Well-Architected pillar focuses on using computing resources efficiently to meet requirements, and maintaining that efficiency as demand and technology evolve?", options:[
"Performance Efficiency",
"Reliability",
"Security",
"Cost Optimization",
], exp:[
"Correct — Performance Efficiency covers selecting the right resource types and sizes and adapting as needs change.",
"Wrong — Reliability is about a workload recovering from failures and consistently meeting demand.",
"Wrong — Security is about protecting data, systems, and assets.",
"Wrong — Cost Optimization is about avoiding unneeded costs, a related but distinct concern from performance."
]},
{domain:"concepts", q:"Which of the following is NOT one of AWS's six commonly cited advantages of cloud computing?", options:[
"A guarantee of zero downtime for any workload",
"Increasing speed and agility",
"No longer needing to run and maintain your own data centers",
"Going global in minutes",
], exp:[

"Wrong — increasing speed and agility is one of the six advantages AWS lists.",
"Wrong — removing the burden of running data centers is one of the six advantages AWS lists.",
"Wrong — going global in minutes by deploying in multiple Regions is one of the six advantages AWS lists."
]},
{domain:"concepts", q:"Which statement about AWS Regions is correct?", options:[
"Each Region is a separate geographic area that contains multiple isolated Availability Zones",
"A Region always contains exactly one data center",
"All AWS Regions share a single electrical grid and network",
"Customers cannot choose which Region their resources run in",
], exp:[

"Wrong — a Region typically contains multiple AZs, each with one or more data centers.",
"Wrong — Regions and AZs are intentionally isolated from each other's power and networking to prevent cascading failures.",
"Wrong — customers explicitly choose the Region(s) they deploy resources into."
]},
{domain:"concepts", q:"How does Auto Scaling relate to the concept of elasticity?", options:[
"It automatically adds or removes compute capacity to maintain performance while controlling cost",
"It permanently fixes the number of running EC2 instances",
"It encrypts data stored on EBS volumes",
"It manages IAM user permissions",
], exp:[

"Wrong — Auto Scaling does the opposite of fixing capacity; it changes the instance count dynamically.",
"Wrong — encryption is handled by services like AWS KMS or EBS encryption settings, not Auto Scaling.",
"Wrong — IAM permissions are managed through AWS IAM, unrelated to Auto Scaling."
]},
{domain:"concepts", q:"What does \"refactoring\" (re-architecting) typically involve during a cloud migration?", options:[

"Moving an application to the cloud with no code changes at all",
"Replacing the application entirely with a third-party SaaS product",
"Shutting the application down permanently",

"Wrong — that describes retiring, not refactoring."

// ---------------- SECURITY AND COMPLIANCE ----------------
{domain:"security", q:"Under the AWS Shared Responsibility Model, who is responsible for patching the hypervisor that underlies EC2?", options:[
"AWS",
"The customer",
"A third-party auditor",
"Whoever configured the VPC",
], exp:[
"Correct — AWS manages security \"of\" the cloud, including the physical infrastructure and virtualization layer.",
"Wrong — the customer is responsible for their guest OS, applications, and data — not the underlying hypervisor.",
"Wrong — auditors verify compliance; they don't patch AWS infrastructure.",
"Wrong — VPC configuration is a customer responsibility, but it's unrelated to hypervisor patching."
]},
{domain:"security", q:"Under the Shared Responsibility Model, who is responsible for configuring security group rules on an EC2 instance?", options:[
"The customer",
"AWS",
"AWS Support",
"The instance configures itself automatically",
], exp:[
"Correct — security in the cloud, including network configuration like security groups, is the customer's responsibility.",
"Wrong — AWS secures the underlying infrastructure but does not configure your application-level network rules.",
"Wrong — AWS Support can advise, but configuring your resources is still on the customer.",
"Wrong — security groups default to denying inbound traffic and must be explicitly configured by the customer."
]},
{domain:"security", q:"What is the recommended best practice for the AWS account root user?", options:[
"Enable MFA on it and avoid using it for everyday tasks",
"Use it for all daily administrative work",
"Share its credentials with the whole team for convenience",
"Disable MFA so sign-in is faster",
], exp:[
"Correct — AWS recommends locking down the root user with MFA and creating individual IAM users/roles for daily work.",
"Wrong — daily tasks should use IAM users or roles with least-privilege permissions, not the root user.",
"Wrong — sharing root credentials removes accountability and dramatically increases security risk.",
"Wrong — MFA should be enabled on the root user, not disabled, since it has unrestricted account access."
]},
{domain:"security", q:"Which IAM feature grants temporary permissions to a service, application, or federated user without sharing long-term credentials?", options:[
"IAM role",
"IAM group",
"IAM user",
"The root account",
], exp:[
"Correct — roles are assumed temporarily and issue short-lived credentials, ideal for services or federated access.",
"Wrong — a group is just a collection of IAM users that share permissions; it doesn't grant temporary credentials itself.",
"Wrong — an IAM user typically has long-term credentials (password or access keys), not temporary ones.",
"Wrong — the root user has permanent, unrestricted credentials — the opposite of temporary, limited access."
]},
{domain:"security", q:"What does the principle of least privilege mean in IAM?", options:[
"Grant only the permissions necessary to perform a specific task, nothing more",
"Grant administrator access to every user by default",
"Deny every user access to all resources at all times",
"Grant permissions based on how long someone has worked at the company",
], exp:[
"Correct — least privilege minimizes risk by limiting what each identity can access to only what it needs.",
"Wrong — broad default access increases the attack surface and violates least privilege.",
"Wrong — denying all access would make the system unusable; least privilege is about the right amount of access, not none.",
"Wrong — permissions should be based on job function/need, not tenure."
]},
{domain:"security", q:"Which AWS service centralizes access to compliance reports and certifications, such as SOC and PCI DSS documentation?", options:[
"AWS Artifact",
"AWS Trusted Advisor",
"AWS Config",
"AWS Shield",
], exp:[
"Correct — AWS Artifact is the self-service portal for downloading AWS's compliance reports and agreements.",
"Wrong — Trusted Advisor gives recommendations on cost, performance, security, and fault tolerance, not compliance documents.",
"Wrong — AWS Config tracks resource configuration changes, not compliance certification documents.",
"Wrong — AWS Shield protects against DDoS attacks; it has no role in compliance reporting."
]},
{domain:"security", q:"Which service continuously analyzes account and network activity using machine learning to detect threats like unusual API calls or compromised instances?", options:[
"Amazon GuardDuty",
"AWS WAF",
"AWS Shield",
"Amazon Inspector",
], exp:[
"Correct — GuardDuty is a threat detection service that monitors for malicious or unauthorized behavior.",
"Wrong — WAF filters malicious web traffic based on rules; it doesn't perform account-wide behavioral threat detection.",
"Wrong — Shield protects against DDoS attacks specifically, not general anomalous activity.",
"Wrong — Inspector scans workloads (like EC2 and containers) for software vulnerabilities, not account-wide behavior."
]},
{domain:"security", q:"Which service helps protect web applications from common exploits such as SQL injection and cross-site scripting?", options:[
"AWS WAF",
"Amazon GuardDuty",
"AWS Shield Standard",
"AWS KMS",
], exp:[
"Correct — WAF (Web Application Firewall) lets you create rules to filter malicious HTTP/HTTPS requests.",
"Wrong — GuardDuty detects threats across your account, but doesn't filter web application layer requests.",
"Wrong — Shield Standard protects against network and transport layer DDoS attacks, not injection attacks.",
"Wrong — KMS manages encryption keys; it has no request-filtering capability."
]},
{domain:"security", q:"What does AWS Shield protect against?", options:[
"Distributed Denial of Service (DDoS) attacks",
"SQL injection attacks exclusively",
"Malware running on EC2 instances",
"Data corruption within Amazon S3",
], exp:[
"Correct — Shield (Standard or Advanced) is purpose-built to protect against DDoS attacks.",
"Wrong — SQL injection is mitigated using AWS WAF rules, not Shield.",
"Wrong — malware protection is typically handled by third-party or endpoint security tools, not Shield.",
"Wrong — S3 durability and versioning address data integrity, which is unrelated to Shield's DDoS focus."
]},
{domain:"security", q:"Which service should you use to automatically discover and protect sensitive data, such as personally identifiable information (PII), stored in Amazon S3?", options:[
"Amazon Macie",
"Amazon Inspector",
"AWS Config",
"AWS CloudTrail",
], exp:[
"Correct — Macie uses machine learning to discover and classify sensitive data like PII in S3.",
"Wrong — Inspector scans compute resources for vulnerabilities, not data classification in S3.",
"Wrong — Config tracks resource configuration compliance, not data content.",
"Wrong — CloudTrail logs API activity; it doesn't scan S3 object content for sensitive data."
]},
{domain:"security", q:"Which statement about security groups is TRUE?", options:[
"Security groups are stateful, so return traffic is automatically allowed regardless of outbound rules",
"Security groups are stateless and require explicit outbound rules for return traffic",
"Security groups operate only at the subnet level, never on individual instances",
"Security groups can only be used to deny traffic, never to allow it",
], exp:[
"Correct — because security groups are stateful, response traffic to an allowed request is automatically permitted.",
"Wrong — that statelessness describes Network ACLs, not security groups.",
"Wrong — security groups act as a virtual firewall at the instance (elastic network interface) level, not the subnet level.",
"Wrong — security groups only contain allow rules; they cannot explicitly deny traffic."
]},
{domain:"security", q:"Which construct operates at the subnet level, is stateless, and evaluates numbered rules in order?", options:[
"Network ACL",
"Security Group",
"IAM policy",
"AWS Shield",
], exp:[
"Correct — Network ACLs are stateless, subnet-level firewalls whose rules are evaluated in numeric order.",
"Wrong — security groups are stateful and apply at the instance level, not the subnet level.",
"Wrong — IAM policies control permissions for identities and resources, not network traffic.",
"Wrong — Shield mitigates DDoS attacks; it isn't a rule-based traffic filter at the subnet level."
]},
{domain:"security", q:"Which service records API calls made within your AWS account for governance, compliance, and auditing purposes?", options:[
"AWS CloudTrail",
"Amazon CloudWatch",
"AWS Config",
"Amazon Macie",
], exp:[
"Correct — CloudTrail logs who did what, when, and from where across your AWS account's API activity.",
"Wrong — CloudWatch focuses on monitoring metrics, logs, and alarms for performance, not an audit trail of API calls.",
"Wrong — Config tracks configuration state and changes to resources, complementing but distinct from CloudTrail's API logging.",
"Wrong — Macie classifies sensitive data; it doesn't log account-wide API activity."
]},
{domain:"security", q:"Which service continuously assesses your AWS resource configurations against a desired state and tracks configuration changes over time?", options:[
"AWS Config",
"AWS CloudTrail",
"Amazon Inspector",
"AWS Trusted Advisor",
], exp:[
"Correct — Config records resource configurations and evaluates them against rules to flag drift or non-compliance.",
"Wrong — CloudTrail logs API call activity; it doesn't evaluate configuration compliance directly.",
"Wrong — Inspector assesses workloads for vulnerabilities, not general resource configuration compliance.",
"Wrong — Trusted Advisor gives best-practice recommendations, but it isn't a continuous configuration-change tracker."
]},
{domain:"security", q:"Which service automatically assesses EC2 instances and container workloads for software vulnerabilities and unintended network exposure?", options:[
"Amazon Inspector",
"Amazon GuardDuty",
"AWS Shield",
"Amazon Macie",
], exp:[
"Correct — Inspector performs automated security assessments looking for vulnerabilities and network exposure.",
"Wrong — GuardDuty focuses on detecting active threats and anomalous behavior, not scanning for known vulnerabilities.",
"Wrong — Shield defends against DDoS attacks and doesn't scan for vulnerabilities.",
"Wrong — Macie's focus is discovering sensitive data in storage, not vulnerability scanning."
]},
{domain:"security", q:"Which statement about encrypting data on AWS is correct?", options:[
"Customers can use AWS KMS to create, manage, and control cryptographic keys used to encrypt their data",
"AWS automatically encrypts all customer data with no configuration options available",
"Encryption is available only for objects stored in Amazon S3",
"Only AWS employees are permitted to manage encryption keys",
], exp:[
"Correct — AWS Key Management Service (KMS) lets customers create and control keys used across many AWS services.",
"Wrong — while some services encrypt by default, customers generally choose and configure encryption options and keys.",
"Wrong — encryption is available across many services, including EBS, RDS, and DynamoDB, not just S3.",
"Wrong — customers can create and manage their own KMS keys (customer managed keys), not just AWS."
]},
{domain:"security", q:"Which policy type, applied within AWS Organizations, sets the maximum available permissions for accounts in an organizational unit?", options:[
"Service Control Policy (SCP)",
"IAM identity-based policy",
"S3 bucket policy",
"Resource-based policy",
], exp:[
"Correct — SCPs set permission guardrails across accounts in an OU, defining the ceiling of what identities can do.",
"Wrong — identity-based policies grant permissions to a specific IAM user, group, or role within one account.",
"Wrong — a bucket policy is a resource-based policy scoped to a single S3 bucket, not an organization-wide guardrail.",
"Wrong — resource-based policies attach to a specific resource, unlike the organization-wide scope of an SCP."
]},
{domain:"security", q:"Which statement about AWS's penetration testing policy is accurate?", options:[
"Customers may perform penetration tests on their own resources for a defined list of allowed services without prior AWS approval, as long as they follow AWS policy",
"Penetration testing is prohibited for all AWS customers under all circumstances",
"AWS requires no notification or adherence to any policy for penetration testing",
"Only AWS employees are permitted to conduct penetration tests on customer resources",
], exp:[
"Correct — AWS publishes a policy that permits customer-initiated testing of many services without prior approval, subject to restrictions.",
"Wrong — testing is allowed for permitted services under AWS's customer support policy for penetration testing.",
"Wrong — customers must still follow AWS's stated penetration testing policy and rules of engagement.",
"Wrong — customers, not just AWS employees, may test their own resources under the policy."
]},
{domain:"security", q:"Which service should be used to securely store and automatically rotate database credentials and other secrets?", options:[
"AWS Secrets Manager",
"Amazon S3",
"AWS IAM Access Analyzer",
"Amazon CloudWatch",
], exp:[
"Correct — Secrets Manager securely stores secrets and can automatically rotate them on a schedule.",
"Wrong — S3 is object storage; it is not designed for automatic secret rotation or fine-grained secret access.",
"Wrong — Access Analyzer identifies resources shared with external entities; it doesn't store or rotate secrets.",
"Wrong — CloudWatch is for monitoring metrics and logs, not secret storage."
]},
{domain:"security", q:"What is Multi-Factor Authentication (MFA) used for?", options:[
"Adding an extra layer of login security beyond just a username and password",
"Encrypting data at rest in a database",
"Distributing traffic across multiple EC2 instances",
"Automatically scaling infrastructure based on demand",
], exp:[
"Correct — MFA requires an additional verification factor (like a one-time code) alongside a password, reducing account takeover risk.",
"Wrong — encryption at rest is handled by services like KMS, not MFA.",
"Wrong — traffic distribution is the job of a load balancer, not MFA.",
"Wrong — scaling is handled by Auto Scaling, unrelated to authentication."
]},
{domain:"security", q:"Under the Shared Responsibility Model, what does \"security OF the cloud\" refer to?", options:[
"AWS's responsibility to protect the infrastructure that runs all of the services offered in the AWS Cloud",
"The customer's responsibility to secure their own data and applications",
"A responsibility held only by third-party auditors",
"Something that no party is responsible for",
], exp:[
"Correct — AWS secures the hardware, software, networking, and facilities that run AWS services.",
"Wrong — that describes \"security IN the cloud,\" which is the customer's part of the model.",
"Wrong — auditors verify and certify compliance; they don't hold this operational responsibility.",
"Wrong — the entire premise of the shared responsibility model is that responsibility is divided, not absent."
]},

// ---------------- CLOUD TECHNOLOGY AND SERVICES ----------------
{domain:"tech", q:"Which AWS service provides resizable virtual server compute capacity in the cloud?", options:[
"Amazon EC2",
"Amazon S3",
"Amazon RDS",
"AWS Lambda",
], exp:[
"Correct — EC2 (Elastic Compute Cloud) provides virtual servers that you can resize and configure as needed.",
"Wrong — S3 is object storage, not virtual server compute.",
"Wrong — RDS is a managed relational database service, not general-purpose compute.",
"Wrong — Lambda runs code without provisioning servers at all, the opposite of EC2's model."
]},
{domain:"tech", q:"Which compute service lets you run code without provisioning or managing servers, billed based on requests and execution time?", options:[
"AWS Lambda",
"Amazon EC2",
"Amazon Lightsail",
"AWS Batch",
], exp:[
"Correct — Lambda is a serverless compute service that runs your code in response to events and charges per invocation/duration.",
"Wrong — EC2 requires you to provision and manage virtual server instances yourself.",
"Wrong — Lightsail provides simplified virtual private servers, but you still manage a running instance.",
"Wrong — Batch schedules and runs batch computing jobs, typically on managed EC2 or Fargate resources, not a pure per-invocation model."
]},
{domain:"tech", q:"Which S3 storage class is designed for data that is accessed less frequently but still needs millisecond retrieval, at a lower storage price than S3 Standard?", options:[
"S3 Standard-Infrequent Access (S3 Standard-IA)",
"S3 Glacier Deep Archive",
"S3 Intelligent-Tiering exclusively",
"S3 One Zone-Express",
], exp:[
"Correct — S3 Standard-IA offers the same low latency as Standard at a lower storage cost, with a retrieval fee.",
"Wrong — Glacier Deep Archive is for long-term archival with retrieval times measured in hours, not milliseconds.",
"Wrong — Intelligent-Tiering automatically moves data between tiers, but the question describes IA specifically.",
"Wrong — this is not a real S3 storage class name."
]},
{domain:"tech", q:"Which storage option is best suited for long-term archival data where retrieval times of several hours are acceptable, in exchange for very low storage cost?", options:[
"Amazon S3 Glacier Deep Archive",
"Amazon EBS",
"Amazon EFS",
"Amazon S3 Standard",
], exp:[
"Correct — Glacier Deep Archive offers the lowest-cost S3 storage class, intended for rarely accessed archival data.",
"Wrong — EBS is block storage attached to EC2 instances, priced for active use, not deep archival.",
"Wrong — EFS is a shared file system meant for active, concurrent access, not cold archival.",
"Wrong — S3 Standard is designed for frequently accessed data and costs more than Glacier tiers."
]},
{domain:"tech", q:"Which storage type is block storage that attaches to a single EC2 instance, functioning like a virtual hard drive?", options:[
"Amazon EBS",
"Amazon S3",
"Amazon EFS",
"Amazon S3 Glacier",
], exp:[
"Correct — Elastic Block Store (EBS) volumes attach to individual EC2 instances as persistent block storage.",
"Wrong — S3 is object storage accessed over HTTP(S), not block storage attached to an instance.",
"Wrong — EFS is a file system designed to be mounted by many instances concurrently, not a single-instance block volume.",
"Wrong — Glacier is an archival storage class within S3, not block storage."
]},
{domain:"tech", q:"Which service provides a scalable, fully managed file system that multiple EC2 instances can mount and access concurrently?", options:[
"Amazon EFS",
"Amazon EBS",
"Amazon S3",
"AWS Storage Gateway",
], exp:[
"Correct — Elastic File System (EFS) is a shared, elastic NFS file system that many instances can mount at once.",
"Wrong — an EBS volume is typically attached to only one instance at a time.",
"Wrong — S3 is object storage accessed via API calls, not a mountable file system for EC2 by default.",
"Wrong — Storage Gateway connects on-premises environments to AWS storage; it isn't itself a shared file system for EC2."
]},
{domain:"tech", q:"A company needs to move 100 TB of data into AWS but has very limited internet bandwidth. Which service is best suited for this?", options:[
"AWS Snowball",
"Amazon S3 Transfer Acceleration alone",
"AWS Direct Connect, which must be provisioned same-day",
"Amazon EBS",
], exp:[
"Correct — Snowball is a physical device AWS ships to you for offline transfer of large data volumes, ideal for limited bandwidth.",
"Wrong — Transfer Acceleration speeds up transfers over the existing internet path, but doesn't solve a fundamental bandwidth shortage for huge datasets.",
"Wrong — Direct Connect provides a dedicated network link, but setting it up takes time and isn't a same-day solution for a one-time large transfer.",
"Wrong — EBS is block storage for EC2, not a bulk data-transfer mechanism into AWS."
]},
{domain:"tech", q:"Which relational database service automates tasks like patching, backups, and failover for engines such as MySQL and PostgreSQL?", options:[
"Amazon RDS",
"Amazon DynamoDB",
"Amazon Redshift",
"Amazon Neptune",
], exp:[
"Correct — RDS is a managed relational database service that handles routine administrative tasks for supported engines.",
"Wrong — DynamoDB is a managed NoSQL key-value/document database, not relational.",
"Wrong — Redshift is a data warehouse for analytics, not a general-purpose relational OLTP database.",
"Wrong — Neptune is a managed graph database service, not a relational database."
]},
{domain:"tech", q:"Which AWS database service is a fully managed key-value and document NoSQL database offering single-digit millisecond performance at virtually any scale?", options:[
"Amazon DynamoDB",
"Amazon RDS",
"Amazon Redshift",
"Amazon Aurora",
], exp:[
"Correct — DynamoDB is AWS's serverless NoSQL database built for fast, scalable key-value and document workloads.",
"Wrong — RDS hosts traditional relational database engines, not NoSQL data models.",
"Wrong — Redshift is designed for large-scale analytical queries, not millisecond transactional lookups.",
"Wrong — Aurora is a relational database engine compatible with MySQL/PostgreSQL, not a NoSQL store."
]},
{domain:"tech", q:"Which service is a fully managed data warehouse optimized for running analytics and complex queries across large datasets?", options:[
"Amazon Redshift",
"Amazon RDS",
"Amazon DynamoDB",
"Amazon ElastiCache",
], exp:[
"Correct — Redshift is purpose-built as a data warehouse for fast analytical (OLAP) queries at scale.",
"Wrong — RDS is optimized for transactional (OLTP) workloads, not large-scale analytics.",
"Wrong — DynamoDB is a NoSQL database for transactional workloads, not a data warehouse.",
"Wrong — ElastiCache is an in-memory caching service, not a data warehouse."
]},
{domain:"tech", q:"Which service provides a logically isolated virtual network within AWS where you can launch resources?", options:[
"Amazon VPC",
"Amazon Route 53",
"AWS Direct Connect",
"Amazon CloudFront",
], exp:[
"Correct — a Virtual Private Cloud (VPC) is your own isolated network space within AWS for launching resources.",
"Wrong — Route 53 is a DNS service, not a virtual network container.",
"Wrong — Direct Connect provides a dedicated network link from on-premises to AWS, not the isolated network itself.",
"Wrong — CloudFront is a content delivery network, unrelated to defining a private virtual network."
]},
{domain:"tech", q:"Which service is a scalable Domain Name System (DNS) web service?", options:[
"Amazon Route 53",
"Amazon CloudFront",
"AWS Global Accelerator",
"Amazon VPC",
], exp:[
"Correct — Route 53 translates domain names into IP addresses and offers features like health checks and routing policies.",
"Wrong — CloudFront is a CDN for caching and delivering content, not a DNS service.",
"Wrong — Global Accelerator improves availability and performance of applications using the AWS global network, but it isn't a DNS service.",
"Wrong — VPC is a virtual network construct, unrelated to DNS resolution."
]},
{domain:"tech", q:"Which service is a global content delivery network (CDN) that caches content at edge locations to reduce latency for end users?", options:[
"Amazon CloudFront",
"Amazon Route 53",
"AWS Direct Connect",
"AWS Snowball",
], exp:[
"Correct — CloudFront caches and delivers content from edge locations close to users, reducing latency.",
"Wrong — Route 53 handles DNS resolution, not content caching/delivery.",
"Wrong — Direct Connect is a dedicated network connection to AWS, not a CDN.",
"Wrong — Snowball is a physical data transfer device, unrelated to content delivery."
]},
{domain:"tech", q:"Which service provides a dedicated, private network connection between an on-premises data center and AWS?", options:[
"AWS Direct Connect",
"AWS Site-to-Site VPN over the public internet",
"Amazon CloudFront",
"Amazon Route 53",
], exp:[
"Correct — Direct Connect establishes a dedicated physical network link between your premises and AWS, bypassing the public internet.",
"Wrong — Site-to-Site VPN creates an encrypted tunnel over the public internet, not a dedicated private line.",
"Wrong — CloudFront is a CDN, not a network connectivity service to on-premises infrastructure.",
"Wrong — Route 53 is a DNS service, unrelated to dedicated network connectivity."
]},
{domain:"tech", q:"Which service automatically distributes incoming application traffic across multiple targets, such as EC2 instances in different Availability Zones?", options:[
"Elastic Load Balancing (ELB)",
"Amazon Route 53 exclusively",
"AWS Auto Scaling exclusively",
"AWS Direct Connect",
], exp:[
"Correct — ELB automatically distributes incoming traffic across multiple targets to improve availability and fault tolerance.",
"Wrong — Route 53 can perform DNS-based routing, but ELB is the primary service for distributing traffic to backend targets.",
"Wrong — Auto Scaling adjusts the number of instances; it doesn't itself distribute incoming traffic.",
"Wrong — Direct Connect is about network connectivity to AWS, not distributing application traffic among targets."
]},
{domain:"tech", q:"Which service lets you monitor AWS resources and applications by collecting metrics and logs and configuring alarms?", options:[
"Amazon CloudWatch",
"AWS CloudTrail",
"AWS Config",
"AWS X-Ray",
], exp:[
"Correct — CloudWatch collects metrics and logs and can trigger alarms and automated actions based on thresholds.",
"Wrong — CloudTrail focuses on logging API calls for auditing, not general performance metrics.",
"Wrong — Config tracks resource configuration compliance over time, not real-time performance metrics/alarms.",
"Wrong — X-Ray traces requests through distributed applications for debugging, a narrower use case than general monitoring."
]},
{domain:"tech", q:"Which service lets you model and provision AWS resources using declarative templates written in JSON or YAML?", options:[
"AWS CloudFormation",
"AWS Elastic Beanstalk",
"AWS OpsWorks",
"AWS Systems Manager",
], exp:[
"Correct — CloudFormation is AWS's Infrastructure as Code service, provisioning resources from JSON/YAML templates.",
"Wrong — Elastic Beanstalk automatically manages the infrastructure for deploying an application, but isn't a general IaC templating service.",
"Wrong — OpsWorks provides managed Chef/Puppet configuration management, a different automation approach than declarative templates.",
"Wrong — Systems Manager provides operational tools like Session Manager and Parameter Store, not resource provisioning via templates."
]},
{domain:"tech", q:"Which service lets you deploy and manage an application by simply uploading your code, automatically handling capacity provisioning, load balancing, and scaling?", options:[
"AWS Elastic Beanstalk",
"Amazon EC2",
"AWS Lambda",
"AWS Fargate",
], exp:[
"Correct — Elastic Beanstalk handles the underlying infrastructure automatically once you upload your application code.",
"Wrong — with plain EC2, you must provision and configure the infrastructure yourself.",
"Wrong — Lambda runs individual functions rather than deploying a full application stack with load balancing.",
"Wrong — Fargate removes the need to manage servers for containers, but it doesn't automatically handle the full application deployment workflow like Beanstalk."
]},
{domain:"tech", q:"Which service is a fully managed message queuing service used to decouple and coordinate components of a distributed application?", options:[
"Amazon SQS",
"Amazon SNS",
"Amazon EventBridge",
"AWS Step Functions",
], exp:[
"Correct — Simple Queue Service (SQS) lets components send, store, and receive messages asynchronously via queues.",
"Wrong — SNS is a pub/sub notification service that pushes messages to subscribers, not a queue for polling.",
"Wrong — EventBridge routes events between applications and AWS services based on rules, a different pattern than a simple queue.",
"Wrong — Step Functions orchestrates multi-step workflows, rather than acting as a message queue."
]},
{domain:"tech", q:"Which service is a fully managed publish/subscribe messaging service used to push notifications to subscribers such as email, SMS, or Lambda functions?", options:[
"Amazon SNS",
"Amazon SQS",
"Amazon MQ",
"Amazon Kinesis",
], exp:[
"Correct — Simple Notification Service (SNS) publishes messages to multiple subscriber endpoints or clients.",
"Wrong — SQS is a queue that consumers poll for messages, rather than a push-based pub/sub service.",
"Wrong — Amazon MQ is a managed message broker for common protocols like ActiveMQ/RabbitMQ, a different use case.",
"Wrong — Kinesis is designed for real-time streaming data ingestion and processing, not pub/sub notifications."
]},
{domain:"tech", q:"Which serverless compute engine lets you run containers without provisioning or managing the underlying EC2 instances?", options:[
"AWS Fargate",
"Amazon EC2",
"AWS Lambda@Edge",
"AWS Batch on EC2",
], exp:[
"Correct — Fargate runs containers (via ECS or EKS) without requiring you to manage the underlying servers.",
"Wrong — running containers on EC2 directly requires you to manage and scale the underlying instances yourself.",
"Wrong — Lambda@Edge runs Lambda functions at edge locations for content customization, not general container hosting.",
"Wrong — Batch on EC2 still relies on managed EC2 instances under the hood, unlike Fargate's serverless model."
]},
{domain:"tech", q:"Which service offers pre-trained AI capabilities to analyze images and video, identifying objects, people, text, and scenes?", options:[
"Amazon Rekognition",
"Amazon SageMaker",
"Amazon Comprehend",
"Amazon Lex",
], exp:[

{domain:"tech", q:"A company wants to run containerized workloads and is deciding between managing its own cluster of EC2 instances or using a serverless option. Which pair of AWS offerings represents these two choices for running containers?", options:[

"Wrong — Dedicated Hosts give you a physical server for licensing/compliance reasons, at a premium, not the deepest discount."

{domain:"billing", q:"Which pricing model provides a significant discount in exchange for committing to a consistent amount of usage over a 1- or 3-year term?", options:[

], exp:[

"Wrong — Trusted Advisor reviews your existing account for best practices, not future cost estimation."
]},
{domain:"billing", q:"Which tool lets you visualize, understand, and analyze your AWS costs and usage patterns over time?", options:[

"AWS Budgets",

], exp:[

{domain:"billing", q:"Which service lets you set custom alerts that trigger when your costs or usage exceed, or are forecasted to exceed, a defined threshold?", options:[

"Wrong — Cost Explorer visualizes spending trends but doesn't natively send threshold-based alerts.",

"Wrong — the Cost and Usage Report provides detailed raw billing data exports, not built-in alerting."
]},
{domain:"billing", q:"Which AWS Support plan includes a designated Technical Account Manager (TAM) and the fastest response times for critical issues?", options:[

"Wrong — Business Support offers 24/7 technical support with faster response times than Developer, but no TAM, unlike Enterprise."

{domain:"billing", q:"What is a key benefit of using consolidated billing within AWS Organizations?", options:[

{domain:"billing", q:"Which feature of AWS Trusted Advisor helps identify opportunities to reduce costs, such as idle or underutilized resources?", options:[

{domain:"concepts", q:"Which Well-Architected Framework pillar focuses on minimizing the environmental impact of running cloud workloads?", options:[

], exp:[

"Wrong — Reliability is about a workload's ability to recover from failures and meet demand, not sustainability."
]},
{domain:"concepts", q:"Which Well-Architected Framework pillar focuses on a workload's ability to recover from disruptions and consistently meet customer demand?", options:[

]},
{domain:"concepts", q:"Which of the following is a benefit AWS associates with using the AWS Cloud Adoption Framework (AWS CAF)?", options:[

"Wrong — CAF actually emphasizes building cloud skills and readiness across the organization, including training."
]},
{domain:"concepts", q:"In the context of AWS CAF's stated benefits, what does the acronym \"ESG\" refer to?", options:[

"Wrong — this describes Auto Scaling groups, unrelated to the ESG acronym.",
"Wrong — this is not a term AWS uses; it is a distractor that sounds plausible but is fabricated."
]},
{domain:"concepts", q:"In cloud economics, what is the key difference between fixed costs and variable costs?", options:[
"Fixed costs stay constant regardless of usage, while variable costs scale up or down with actual usage",
"Fixed costs only apply to Amazon S3, while variable costs apply to every other service",
"Fixed costs are billed annually, and variable costs are billed only once",
"There is no meaningful difference between the two terms",
], exp:[
"Correct — moving to the cloud generally shifts spending away from large fixed costs (like data centers) toward variable, usage-based costs.",
"Wrong — the fixed/variable distinction is a general cost concept, not tied to one specific AWS service.",
"Wrong — billing frequency doesn't define whether a cost is fixed or variable; usage-based scaling does.",
"Wrong — the distinction is central to understanding why cloud cost models differ from on-premises models."
]},
{domain:"concepts", q:"Which of the following is a cost typically associated with running an on-premises data center that moving to AWS helps a company avoid?", options:[
"Ongoing facility costs such as power, cooling, physical security, and real estate",
"Amazon EC2 On-Demand usage charges",
"Amazon S3 storage charges",
"AWS Support plan subscription fees",
], exp:[
"Correct — on-premises infrastructure carries continuous facility overhead that AWS's shared infrastructure model removes for customers.",
"Wrong — this is a cost that is incurred when using AWS, not one that is avoided by using it.",
"Wrong — this is also a cost incurred while using AWS, not an on-premises-specific cost being avoided.",
"Wrong — Support plan fees are optional AWS costs, not something the cloud helps you avoid from on-premises operations."
]},
{domain:"concepts", q:"A company wants to bring its existing, already-purchased software licenses to AWS instead of paying for AWS's included licensing option. What is this approach called?", options:[
"Bring Your Own License (BYOL)",
"Consolidated billing",
"A Savings Plan",
"A Reserved Instance",
], exp:[
"Correct — BYOL lets customers use previously purchased licenses on AWS infrastructure instead of paying for licenses bundled into instance pricing.",
"Wrong — consolidated billing combines usage and billing across AWS Organizations accounts; it's unrelated to software licensing.",
"Wrong — a Savings Plan is a compute pricing discount model, not a licensing strategy.",
"Wrong — a Reserved Instance is a compute commitment discount, not a licensing strategy."
]},
{domain:"concepts", q:"What does \"rightsizing\" mean in the context of cloud cost optimization?", options:[
"Matching instance types and sizes to actual workload requirements to avoid paying for unused capacity",
"Always choosing the largest available instance size to avoid future resizing",
"Purchasing a 3-year Reserved Instance for every workload regardless of usage pattern",
"Migrating every workload to serverless compute",
], exp:[
"Correct — rightsizing analyzes actual utilization and adjusts resource sizes so you pay only for what you need.",
"Wrong — over-provisioning to the largest size is the opposite of rightsizing and increases unnecessary cost.",
"Wrong — committing to long terms without analyzing usage patterns can lead to paying for unused capacity, the opposite of rightsizing's goal.",
"Wrong — rightsizing applies to any compute model; it doesn't mean everything must become serverless."
]},
{domain:"concepts", q:"How does using AWS CloudFormation to provision infrastructure support the cloud economics principle of automation?", options:[
"It lets you define infrastructure as code, so environments can be provisioned consistently and repeatedly with less manual effort and fewer errors",
"It automatically negotiates lower EC2 On-Demand pricing on your behalf",
"It encrypts all data in every S3 bucket in the account by default",
"It removes the need for an AWS account to have any IAM configuration",
], exp:[
"Correct — CloudFormation templates let you automate and standardize provisioning, reducing the manual work and error-proneness of clicking through the console repeatedly.",
"Wrong — CloudFormation provisions resources at their standard prices; it doesn't negotiate custom discounts.",
"Wrong — CloudFormation does not automatically enable encryption on every resource; that must be configured explicitly.",
"Wrong — IAM permissions are still required to control who can create and manage CloudFormation stacks and resources."
]},
{domain:"concepts", q:"What is a key economic benefit of using a managed AWS service, such as Amazon RDS, instead of self-managing the same software on EC2?", options:[
"AWS handles operational tasks like patching, backups, and failover, reducing the operational burden and staff time required",
"Managed services are always free of charge",
"Managed services eliminate the need for the customer to store any data",
"Managed services remove the customer's responsibility for their own IAM permissions",
], exp:[
"Correct — offloading routine operational tasks to AWS reduces the time and specialized staff effort needed to keep the system running.",
"Wrong — managed services are billed like other AWS services; they are not free.",
"Wrong — customers still own and are responsible for their data regardless of which compute/database model they use.",
"Wrong — customers remain responsible for configuring IAM access to their resources under the shared responsibility model."
]},
{domain:"concepts", q:"A company is migrating its production database to AWS and wants near-zero downtime by continuously syncing changes from the source database until a final cutover. Which migration approach does this describe?", options:[
"Database replication (for example, using AWS Database Migration Service) to keep source and target in sync until cutover",
"Using AWS Snowball to physically ship a one-time backup of the database",
"Manually exporting and re-importing a CSV file once a month",
"Shutting the database down for a week while data is copied over the internet",
], exp:[
"Correct — ongoing replication keeps the target database current with the source, enabling a low-downtime cutover once they're in sync.",
"Wrong — Snowball is well-suited to large one-time bulk transfers, not continuous, near-zero-downtime replication.",
"Wrong — periodic manual exports would not keep the databases continuously in sync and would risk significant data loss.",
"Wrong — extended downtime is exactly what a replication-based migration approach is designed to avoid."
]},
{domain:"concepts", q:"Which statement best summarizes AWS's overall value proposition for adopting the cloud?", options:[
"Access to a broad set of on-demand technology services with pay-as-you-go pricing, reducing the need for large upfront infrastructure investment",
"A guarantee that every workload will run at a lower cost than on-premises, with no exceptions",
"Free use of all compute, storage, and database services for the lifetime of an account",
"Mandatory use of a single Region and a single Availability Zone for all resources",

"Wrong — cost outcomes depend on architecture and usage patterns; AWS doesn't guarantee savings in every case.",
"Wrong — AWS services are billed based on usage (beyond limited Free Tier offers), not free indefinitely.",
"Wrong — AWS encourages using multiple Availability Zones and, where appropriate, multiple Regions for resilience."
]},
{domain:"concepts", q:"How does \"high availability\" differ from \"elasticity\" as a cloud computing benefit?", options:[
"High availability focuses on minimizing downtime through redundancy, while elasticity focuses on automatically matching capacity to demand",
"They are two names for exactly the same concept",
"High availability applies only to databases, while elasticity applies only to compute",
"High availability means using a single server with no backups, while elasticity means using multiple Regions",
], exp:[
"Correct — high availability is about resilience and uptime, whereas elasticity is about scaling resources up or down as demand changes.",
"Wrong — while related, they address different concerns: uptime/resilience versus dynamic scaling.",
"Wrong — both concepts apply broadly across compute, storage, database, and other services, not just one category each.",
"Wrong — this description is backward and doesn't reflect either concept accurately."
]},
{domain:"concepts", q:"What is the primary purpose of the AWS Well-Architected Framework?", options:[
"To provide a consistent set of best-practice pillars for evaluating and improving the design of cloud architectures",
"To serve as a mandatory certification exam required before deploying any workload",
"To function as AWS's cost calculator for estimating monthly bills",
"To serve as AWS's official compliance and audit report for regulators",
], exp:[
"Correct — the framework offers pillars and guiding questions that teams use to review and improve their architectures.",
"Wrong — using the Well-Architected Framework is a best practice, not a mandatory gate before deployment.",
"Wrong — cost estimation is the role of the AWS Pricing Calculator, a separate tool.",
"Wrong — compliance reports are provided through AWS Artifact, not the Well-Architected Framework."
]},
{domain:"concepts", q:"Which pair of Well-Architected pillars are most directly focused on, respectively, minimizing unnecessary spend and minimizing environmental impact?", options:[

"Security and Reliability",

"Wrong — Reliability addresses resilience, not environmental impact, so this pairing is incomplete."
]},
{domain:"concepts", q:"Which of the following is a real-world example of AWS customers benefiting from economies of scale?", options:[
"AWS has lowered its on-demand service prices multiple times over the years as its infrastructure and customer base have grown",
"Every AWS customer pays exactly the same total bill each month, regardless of usage",
"AWS requires customers to purchase hardware in bulk to receive any discount",
"Economies of scale only apply to customers with Enterprise Support contracts",
], exp:[
"Correct — as AWS's scale has grown, it has been able to reduce prices for customers multiple times, a direct result of economies of scale.",
"Wrong — bills vary based on each customer's actual usage, not a flat universal amount.",
"Wrong — AWS customers don't purchase physical hardware at all; that is exactly what economies of scale eliminates the need for.",
"Wrong — economies of scale benefits (such as historical price reductions) apply broadly to AWS customers, not only Enterprise Support subscribers."
]},
{domain:"concepts", q:"A retailer wants to launch its application in a new overseas market as quickly as possible. Which benefit of AWS's global infrastructure directly supports this goal?", options:[
"The ability to deploy infrastructure in a target AWS Region within minutes, instead of building new physical data centers",
"A requirement to first build a private data center in the new country",
"A mandatory multi-year contract before entering a new Region",
"Free legal consulting services bundled with every AWS account",
], exp:[

"Wrong — this describes the traditional on-premises approach that AWS's global infrastructure is meant to replace.",
"Wrong — AWS does not require long-term contracts to use a Region; usage is generally on-demand.",
"Wrong — AWS does not provide legal consulting services as part of standard account access."
]},

// ---------------- ADDITIONAL: SECURITY AND COMPLIANCE ----------------
{domain:"security", q:"Which service provides centralized single sign-on (SSO) access to multiple AWS accounts and business applications from one place?", options:[
"AWS IAM Identity Center (AWS Single Sign-On)",
"AWS Secrets Manager",
"AWS Organizations",
"Amazon Cognito",
], exp:[
"Correct — IAM Identity Center provides a single place to manage SSO access across multiple AWS accounts and supported business applications.",
"Wrong — Secrets Manager stores and rotates secrets like database credentials; it doesn't provide SSO.",
"Wrong — Organizations manages multi-account structure and billing, but SSO access itself is handled by IAM Identity Center.",
"Wrong — Cognito provides identity and access management for customer-facing applications, not workforce SSO across AWS accounts."
]},
{domain:"security", q:"What does \"federated identity\" allow users to do when accessing AWS?", options:[
"Sign in using existing corporate or third-party credentials (for example, via SAML) without needing a separate IAM user",
"Automatically become the account root user",
"Bypass all IAM permissions entirely",
"Access AWS only through the root user's access keys",
], exp:[
"Correct — federation lets users authenticate with an existing identity provider and be granted temporary AWS access without a dedicated IAM user.",
"Wrong — federation does not grant root user privileges; it grants scoped, temporary access based on assigned permissions.",
"Wrong — federated users still operate under IAM policies and permission boundaries.",
"Wrong — the point of federation is to avoid relying on long-term credentials like root access keys."
]},
{domain:"security", q:"A company wants to let a trusted partner's AWS account access specific resources in its own account, without sharing long-term credentials. What should it use?", options:[
"A cross-account IAM role that the partner's account can assume",
"The company's root user credentials, shared directly with the partner",
"A single shared IAM user with a password given to the partner",
"Disabling all security groups on the relevant resources",
], exp:[
"Correct — a cross-account role lets a trusted external account assume temporary, scoped permissions without ever handling long-term credentials.",
"Wrong — sharing root credentials is a major security risk and violates best practice, regardless of trust level.",
"Wrong — sharing a single IAM user's credentials removes accountability and is not a recommended cross-account access pattern.",
"Wrong — disabling security groups would open network access broadly and is unrelated to controlled cross-account permissions."
]},
{domain:"security", q:"Which IAM feature lets an administrator enforce rules such as minimum length and required rotation for IAM user passwords?", options:[
"An IAM password policy",
"An S3 bucket policy",
"A Service Control Policy (SCP)",
"AWS Shield configuration",
], exp:[
"Correct — an account-wide IAM password policy defines requirements like minimum length, complexity, and rotation for IAM user passwords.",
"Wrong — a bucket policy controls access to a specific S3 bucket, not account-wide password requirements.",
"Wrong — SCPs set permission guardrails across accounts in an organization; they don't define password complexity rules.",
"Wrong — Shield protects against DDoS attacks and has nothing to do with password requirements."
]},
{domain:"security", q:"What is the difference between an AWS managed policy and a customer managed policy in IAM?", options:[
"AWS managed policies are created and maintained by AWS, while customer managed policies are created and maintained by the customer for finer control",
"AWS managed policies can only deny access, while customer managed policies can only allow access",
"Customer managed policies apply automatically to every AWS account in the world",
"There is no functional difference between the two",
], exp:[
"Correct — AWS managed policies are convenient, pre-built policies maintained by AWS, while customer managed policies give you precise, self-maintained control.",
"Wrong — both policy types can contain allow or deny statements; the distinction is about who creates and maintains them, not allow-vs-deny.",
"Wrong — customer managed policies are scoped to the customer's own account, not applied globally to all AWS accounts.",
"Wrong — the ownership and maintenance responsibility differs meaningfully between the two types."
]},
{domain:"security", q:"Which service aggregates and prioritizes security findings from multiple AWS services, such as GuardDuty and Inspector, into a single dashboard?", options:[
"AWS Security Hub",
"AWS Config",
"AWS CloudTrail",
"AWS Trusted Advisor",
], exp:[
"Correct — Security Hub provides a consolidated view of security findings and compliance status from multiple AWS security services.",
"Wrong — Config tracks resource configuration compliance over time; it isn't a findings-aggregation dashboard for other security tools.",
"Wrong — CloudTrail logs API activity; it doesn't aggregate findings from services like GuardDuty and Inspector.",
"Wrong — Trusted Advisor gives general best-practice checks across categories, but isn't a security-findings aggregator for other security services."
]},
{domain:"security", q:"Which service helps continuously audit your AWS usage to simplify assessing risk and compliance with regulations and industry standards?", options:[
"AWS Audit Manager",
"AWS Artifact",
"AWS CloudTrail",
"AWS IAM Access Analyzer",
], exp:[

"Wrong — Artifact provides access to AWS's own compliance reports and agreements, rather than auditing your account's usage.",
"Wrong — CloudTrail logs API activity but doesn't map that activity to compliance frameworks the way Audit Manager does.",
"Wrong — Access Analyzer identifies resources shared with external entities; it isn't a general compliance-auditing service."
]},
{domain:"security", q:"Which service helps analyze and visualize security data to investigate the root cause of a potential security issue after it's been detected?", options:[
"Amazon Detective",
"Amazon GuardDuty",
"Amazon Macie",
"Amazon Inspector",
], exp:[
"Correct — Detective helps analyze, investigate, and visualize security data to quickly identify the root cause of findings.",
"Wrong — GuardDuty detects threats and generates findings, but investigating the root cause is Detective's specific role.",
"Wrong — Macie discovers and classifies sensitive data; it doesn't provide investigative visualization of security incidents.",
"Wrong — Inspector scans for vulnerabilities; it isn't focused on investigating the root cause of a detected security incident."
]},
{domain:"security", q:"What is the difference between \"encryption in transit\" and \"encryption at rest\"?", options:[
"Encryption in transit protects data as it moves across a network, while encryption at rest protects data stored on disk",
"Encryption in transit is only available for Amazon S3, while encryption at rest is only available for Amazon EC2",
"Encryption at rest happens only during data transfer between Regions",
"They are two different names for the exact same protection mechanism",
], exp:[
"Correct — data in transit is protected using protocols like TLS while traveling over a network, while data at rest is encrypted where it's stored, such as on EBS or in S3.",
"Wrong — both encryption types are available across many AWS services, not limited to just S3 or EC2 respectively.",
"Wrong — encryption at rest protects stored data, regardless of whether a Region-to-Region transfer is happening.",
"Wrong — they protect data at different stages (moving versus stored) and often use different mechanisms."
]},
{domain:"security", q:"A healthcare company needs to confirm that AWS services meet regulatory requirements like HIPAA before storing patient data. Where should it look first?", options:[
"AWS Artifact and AWS's published compliance program documentation",
"The Amazon EC2 console",
"AWS Budgets",
"The AWS Snowball order history",

"Wrong — the EC2 console manages compute instances; it has no compliance documentation features.",
"Wrong — Budgets is a cost management tool, unrelated to compliance certification lookup.",
"Wrong — Snowball order history relates to physical data transfer devices, not compliance documentation."
]},
{domain:"security", q:"Where can customers find and deploy pre-configured third-party security software, such as firewalls or antivirus tools, for use on AWS?", options:[
"AWS Marketplace",
"AWS Artifact",
"AWS re:Post",
"AWS IQ",
], exp:[

"Wrong — Artifact provides AWS's own compliance documents, not a catalog of third-party software.",
"Wrong — re:Post is a community-driven Q&A knowledge resource, not a software marketplace.",
"Wrong — AWS IQ connects customers with independent AWS experts for on-demand project work, not a software catalog."
]},
{domain:"security", q:"Besides cost optimization, which of the following categories does AWS Trusted Advisor also provide checks for?", options:[
"Security, performance, fault tolerance, and service limits",
"Only compliance certifications like SOC and PCI",
"Only legal contract terms",
"Only third-party software licensing",

"Wrong — third-party licensing isn't one of Trusted Advisor's check categories."
]},
{domain:"security", q:"Compared with Amazon EC2, how does the AWS Shared Responsibility Model shift for AWS Lambda?", options:[
"AWS takes on more responsibility with Lambda, managing the underlying servers and runtime, while the customer focuses mainly on their code",
"The customer takes on all infrastructure responsibility with Lambda, identical to a self-managed data center",
"There is no shared responsibility model for serverless services like Lambda",
"AWS becomes responsible for the customer's application code and its logic",
], exp:[
